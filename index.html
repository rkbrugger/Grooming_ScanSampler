<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grooming Scan Sampler</title>
<style>
  :root{
    --bg:#E4E6E0; --surface:#F5F6F2; --surface-2:#EAECE5; --raise:#FBFBF8;
    --ink:#1C2321; --ink-soft:#5A635D; --ink-faint:#8A928C; --line:#CBCFC6; --line-strong:#B4BAB0;
    --dyadic:#1E6B6E; --dyadic-bg:#D5E6E5; --dyadic-line:#8FC4C1;
    --polyadic:#B06713; --polyadic-bg:#F0E1C7; --polyadic-line:#DDB877;
    --danger:#A63A2C; --danger-bg:#F0D9D4;
    --ok:#2E7D46;
    --shadow:0 1px 0 rgba(28,35,33,.04), 0 6px 22px -14px rgba(28,35,33,.28);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --r:14px; --r-sm:9px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111614; --surface:#191F1C; --surface-2:#212824; --raise:#1F2622;
      --ink:#E7EBE5; --ink-soft:#9AA39C; --ink-faint:#6C756E; --line:#2E3733; --line-strong:#3C453F;
      --dyadic:#57B7AB; --dyadic-bg:#122E2B; --dyadic-line:#2C5551;
      --polyadic:#DA9C4B; --polyadic-bg:#33260E; --polyadic-line:#5B4A26;
      --danger:#E37D6E; --danger-bg:#331A16;
      --ok:#5FB87A;
      --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111614; --surface:#191F1C; --surface-2:#212824; --raise:#1F2622;
    --ink:#E7EBE5; --ink-soft:#9AA39C; --ink-faint:#6C756E; --line:#2E3733; --line-strong:#3C453F;
    --dyadic:#57B7AB; --dyadic-bg:#122E2B; --dyadic-line:#2C5551;
    --polyadic:#DA9C4B; --polyadic-bg:#33260E; --polyadic-line:#5B4A26;
    --danger:#E37D6E; --danger-bg:#331A16;
    --ok:#5FB87A;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -18px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:860px; margin:0 auto; padding:0 16px 72px}

  /* Header */
  header.top{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%, transparent);
    backdrop-filter:saturate(1.2) blur(8px); -webkit-backdrop-filter:saturate(1.2) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:860px; margin:0 auto; padding:12px 16px 0}
  .brand{display:flex; align-items:center; gap:11px; justify-content:space-between}
  .brand h1{
    font-size:17px; font-weight:650; letter-spacing:-.015em; margin:0; display:flex; align-items:center; gap:9px;
  }
  .brand h1 .glyph{color:var(--dyadic)}
  .theme-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    width:36px; height:36px; border-radius:9px; cursor:pointer; display:grid; place-items:center;
    font-size:15px;
  }
  .theme-btn:hover{border-color:var(--line-strong); color:var(--ink)}
  nav.tabs{display:flex; gap:2px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none; border:0; background:transparent; color:var(--ink-soft);
    font-family:inherit; font-size:14.5px; font-weight:550; padding:9px 13px 12px; cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap; letter-spacing:-.01em;
  }
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--dyadic)}
  .tab:hover{color:var(--ink)}

  /* Cards */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; margin-top:14px; box-shadow:var(--shadow);
  }
  .card.flush{padding:0; overflow:hidden}
  .card h2{font-size:13px; font-weight:600; letter-spacing:.01em; color:var(--ink-soft); margin:0 0 12px; text-transform:none}
  .muted{color:var(--ink-soft)}
  .faint{color:var(--ink-faint)}

  /* Session banner */
  .sess-banner{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .sess-id{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .sess-id .sp{font-weight:650; font-size:19px; letter-spacing:-.02em}
  .sess-id .gp{font-weight:550; font-size:19px; letter-spacing:-.02em; color:var(--dyadic)}
  .sess-meta{font-size:13px; color:var(--ink-soft); margin-top:2px}
  .sess-meta b{font-weight:600; color:var(--ink)}

  /* Scan console */
  .console{
    display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center;
  }
  .scan-read{
    background:var(--raise); border:1px solid var(--line); border-radius:12px; padding:12px 18px; text-align:center; min-width:118px;
  }
  .scan-read .lbl{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:600}
  .scan-read .num{font-family:var(--mono); font-size:44px; line-height:1; font-weight:600; letter-spacing:-.03em; margin-top:3px}
  .scan-ctrls{display:flex; flex-direction:column; gap:9px; min-width:0}
  .scan-note{font-size:13px; color:var(--ink-soft)}
  .scan-note b{color:var(--ink); font-weight:600}

  /* Timer */
  .timer{border-top:1px dashed var(--line); margin-top:16px; padding-top:14px}
  .timer-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .timer-face{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .timer-bar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:10px}
  .timer-bar > i{display:block; height:100%; background:var(--dyadic); width:0%; transition:width .28s linear}
  .timer-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px}
  .timer-set{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft)}
  .timer-set input{width:64px}
  .chk{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; user-select:none}
  .chk input{width:16px; height:16px; accent-color:var(--dyadic)}
  @keyframes flashdue{0%,100%{background:var(--surface)}35%{background:var(--dyadic-bg)}}
  .card.due{animation:flashdue 1s ease 2}

  /* Log buttons */
  .log-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  @media (max-width:560px){ .log-grid{grid-template-columns:1fr} }
  .logbtn{
    appearance:none; cursor:pointer; text-align:left; font-family:inherit;
    border:1.5px solid var(--line); background:var(--raise); color:var(--ink);
    border-radius:12px; padding:15px 15px 13px; display:flex; flex-direction:column; gap:10px;
    transition:transform .06s ease, border-color .12s ease, background .12s ease;
  }
  .logbtn:active{transform:translateY(1px) scale(.995)}
  .logbtn .ico{width:38px; height:24px}
  .logbtn .t{font-weight:640; font-size:16px; letter-spacing:-.01em; line-height:1.1}
  .logbtn .s{font-size:12.5px; color:var(--ink-soft); line-height:1.25}
  .logbtn .tally{margin-top:auto; font-family:var(--mono); font-size:12px; color:var(--ink-faint); font-weight:600}
  .logbtn.dy{border-color:var(--dyadic-line)} .logbtn.dy:hover{background:var(--dyadic-bg)}
  .logbtn.dy .ico{color:var(--dyadic)} .logbtn.dy .tally b{color:var(--dyadic)}
  .logbtn.po{border-color:var(--polyadic-line)} .logbtn.po:hover{background:var(--polyadic-bg)}
  .logbtn.po .ico{color:var(--polyadic)} .logbtn.po .tally b{color:var(--polyadic)}

  /* Current scan chips */
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; min-height:2px}
  .chip{
    display:inline-flex; align-items:center; gap:7px; padding:5px 6px 5px 10px; border-radius:99px;
    font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--raise);
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.82); opacity:0}to{transform:scale(1); opacity:1}}
  .chip.dy{background:var(--dyadic-bg); border-color:var(--dyadic-line); color:var(--dyadic)}
  .chip.po{background:var(--polyadic-bg); border-color:var(--polyadic-line); color:var(--polyadic)}
  .chip .x{
    width:18px; height:18px; border-radius:99px; border:0; cursor:pointer; display:grid; place-items:center;
    background:color-mix(in srgb,currentColor 16%, transparent); color:inherit; font-size:12px; line-height:1;
  }
  .chip .x:hover{background:color-mix(in srgb,currentColor 30%, transparent)}
  .empty-scan{font-size:13px; color:var(--ink-faint); font-style:italic; padding:2px 0}

  /* Polyadic size picker */
  .logbtn.armed{background:var(--polyadic-bg); border-color:var(--polyadic); box-shadow:inset 0 0 0 1px var(--polyadic)}
  .arm{margin-top:12px; border:1.5px solid var(--polyadic-line); background:var(--polyadic-bg); border-radius:12px; padding:13px 14px; animation:pop .16s ease}
  .arm-q{font-size:14.5px; font-weight:650; color:var(--polyadic); margin-bottom:11px; display:flex; align-items:center; gap:9px; letter-spacing:-.01em}
  .arm-q .ico{width:32px; height:19px; flex:none}
  .arm-nums{display:flex; flex-wrap:wrap; gap:8px}
  .numbtn{appearance:none; cursor:pointer; font-family:var(--mono); font-weight:600; font-size:17px; min-width:46px; height:46px; border-radius:11px; border:1.5px solid var(--polyadic-line); background:var(--raise); color:var(--ink)}
  .numbtn:hover{border-color:var(--polyadic); background:var(--surface)}
  .numbtn:active{transform:translateY(1px)}
  .arm-more{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:12px; border-top:1px dashed var(--polyadic-line); padding-top:12px}
  .arm-more .lbl{font-size:12.5px; color:var(--ink-soft)}
  .stepper{display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; background:var(--raise)}
  .stepper button{appearance:none; border:0; background:transparent; color:var(--ink); width:38px; height:38px; font-size:20px; line-height:1; cursor:pointer}
  .stepper button:hover{background:var(--surface-2)}
  .stepper .sv{font-family:var(--mono); font-weight:600; min-width:32px; text-align:center; font-size:16px}
  .szcell{max-width:76px; min-width:60px; text-align:center; font-family:var(--mono); font-weight:600}

  /* Per-scan count fields */
  .counts-row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-top:4px}
  .cfield{display:flex; flex-direction:column; gap:4px}
  .cfield > span{font-size:11px; letter-spacing:.02em; color:var(--ink-faint); font-weight:600}
  .cfield input{width:104px; font-family:var(--mono); font-weight:600; text-align:center}
  .cfield.inview{align-items:flex-start}
  .cfield.inview b{font-family:var(--mono); font-size:22px; line-height:1; color:var(--dyadic)}
  .cfield.inview .of{font-size:11px; color:var(--ink-faint); font-weight:600; margin-top:1px}

  /* Species / group / institution editor */
  .sp-block{border:1px solid var(--line); border-radius:12px; padding:13px 13px 11px; margin-bottom:12px; background:var(--raise)}
  .sp-block-head{display:flex; align-items:flex-end; gap:10px}
  .sp-block-head .fld{flex:1; margin:0}
  .grp-list{display:flex; flex-direction:column; gap:8px; margin-top:11px; padding-top:11px; border-top:1px dashed var(--line)}
  .grp-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center}
  .grp-row input{font-size:14px}
  @media (max-width:560px){
    .grp-row{grid-template-columns:1fr auto}
    .grp-row .grp-inst{grid-column:1 / -1}
  }

  /* Session clock */
  .sess-clock{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none}
  .clk-lbl{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:600}
  .clock-face{font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px}
  .clock-face .dot{width:8px; height:8px; border-radius:99px; background:var(--ink-faint); flex:none}
  .clock-face.run .dot{background:var(--ok); animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* Subgroup census */
  .census-head{font-weight:640; font-size:15.5px; letter-spacing:-.01em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .census-head .faint{font-weight:400; font-size:13px}
  .census-sum{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .census-sum .big{font-size:15px; margin-top:3px}
  .census-sum .big b{font-family:var(--mono)}
  .subrows{display:flex; flex-direction:column; gap:8px; margin:13px 0 4px}
  .subrow{display:flex; align-items:center; gap:10px}
  .subrow .lab{font-size:13.5px; color:var(--ink-soft); min-width:98px; font-weight:550}
  .subrow input{width:88px; text-align:center; font-family:var(--mono); font-weight:600}
  .census-tot{font-size:13.5px; color:var(--ink-soft); margin-top:8px}
  .census-tot b{color:var(--ink); font-family:var(--mono)}

  /* Tally strip */
  .tallies{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  @media (max-width:560px){ .tallies{grid-template-columns:repeat(2,1fr)} }
  .tally-cell{background:var(--surface); padding:11px 12px}
  .tally-cell .k{font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em}
  .tally-cell .v{font-family:var(--mono); font-size:23px; font-weight:600; letter-spacing:-.02em; margin-top:2px}
  .tally-cell.dyv .v{color:var(--dyadic)} .tally-cell.pov .v{color:var(--polyadic)}
  .tally-cell .sub{font-size:11px; color:var(--ink-soft); margin-top:1px}

  /* Buttons */
  .btn{
    appearance:none; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:9px 14px; display:inline-flex; align-items:center; gap:7px; letter-spacing:-.01em;
    transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .btn.primary:hover{opacity:.92}
  .btn.accent{background:var(--dyadic); color:#fff; border-color:var(--dyadic)}
  .btn.accent:hover{opacity:.92}
  .btn.ghost{background:transparent}
  .btn.small{padding:6px 10px; font-size:13px; border-radius:8px}
  .btn.danger{color:var(--danger); border-color:var(--danger)}
  .btn.danger:hover{background:var(--danger-bg)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap}

  /* Forms */
  label.fld{display:block; margin-bottom:12px}
  label.fld > span{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px}
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    background:var(--raise); border:1px solid var(--line-strong); border-radius:9px; padding:9px 11px;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--dyadic); outline-offset:1px; border-color:var(--dyadic)}
  textarea{resize:vertical; min-height:52px}
  .form-2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
  @media (max-width:560px){ .form-2{grid-template-columns:1fr} }

  /* Tables */
  .tbl-scroll{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:13.5px}
  th,td{text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:650; background:var(--surface-2); position:sticky; top:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num, th.num{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
  .pill{display:inline-block; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:650}
  .pill.dy{background:var(--dyadic-bg); color:var(--dyadic)}
  .pill.po{background:var(--polyadic-bg); color:var(--polyadic)}
  td .mini{font-size:12px; color:var(--ink-soft)}
  tr.grp-total td{background:var(--surface-2); font-weight:700}
  .icell{border:1px solid var(--line); border-radius:7px; background:var(--raise); padding:5px 8px; font-size:12.5px; width:100%; min-width:120px}

  /* Sessions list */
  .sess-list{display:flex; flex-direction:column; gap:8px}
  .sess-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:var(--raise)}
  .sess-item .info .l1{font-weight:600; letter-spacing:-.01em}
  .sess-item .info .l1 .gp{color:var(--dyadic)}
  .sess-item .info .l2{font-size:12.5px; color:var(--ink-soft); font-family:var(--mono)}
  .sess-item.active{border-color:var(--dyadic); background:var(--dyadic-bg)}
  .row-actions{display:flex; gap:6px; flex-shrink:0}

  .icobtn{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:14px}
  .icobtn:hover{color:var(--danger); border-color:var(--danger)}

  .hint{font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5}
  .divider{height:1px; background:var(--line); margin:16px 0}
  .kbd{font-family:var(--mono); font-size:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px}

  /* Toast */
  #toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:60; max-width:90vw;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger); color:#fff}

  /* Modal */
  #modal, #endmodal{position:fixed; inset:0; background:rgba(10,14,12,.5); display:none; place-items:center; z-index:70; padding:18px}
  #modal.show, #endmodal.show{display:grid}
  .modal-box{background:var(--surface); border:1px solid var(--line-strong); border-radius:14px; padding:18px; max-width:640px; width:100%; box-shadow:var(--shadow)}
  .modal-box h3{margin:0 0 6px; font-size:16px}
  .modal-box textarea{min-height:220px; font-family:var(--mono); font-size:12px; white-space:pre; overflow:auto}

  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1><span class="glyph" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="8" r="2.4"/><circle cx="17" cy="8" r="2.4"/><circle cx="12" cy="16.5" r="2.4"/><path d="M9 8.6 15 8.6M8.2 10 11 14.6M15.8 10 13 14.6"/></svg>
      </span>Grooming Scan Sampler</h1>
      <button class="theme-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="record">Record</button>
      <button class="tab" role="tab" data-tab="summary">Summary</button>
      <button class="tab" role="tab" data-tab="data">Data &amp; export</button>
      <button class="tab" role="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="modal-box">
  <h3 id="modalTitle">Export</h3>
  <p class="muted" id="modalMsg" style="font-size:13px;margin:0 0 10px"></p>
  <textarea id="modalText" readonly></textarea>
  <div class="btn-row" style="margin-top:12px;justify-content:flex-end">
    <button class="btn ghost" data-action="modal-close">Close</button>
    <button class="btn primary" data-action="modal-copy">Copy to clipboard</button>
  </div>
</div></div>

<div id="endmodal" role="dialog" aria-modal="true"><div class="modal-box">
  <h3>End this session?</h3>
  <p class="muted" style="font-size:13.5px;margin:0 0 16px;line-height:1.55">The <b>end-of-session subgroup census</b> hasn't been recorded yet. Logging how many subgroups are present and their sizes at the end keeps your census data complete.</p>
  <div class="btn-row" style="justify-content:flex-end;flex-wrap:wrap">
    <button class="btn ghost" data-action="end-cancel">Cancel</button>
    <button class="btn" data-action="end-anyway">End without census</button>
    <button class="btn primary" data-action="end-record">Record end census</button>
  </div>
</div></div>

<script>
"use strict";

/* ---------- SVG icons (taxonomy is encoded, not decorative) ---------- */
const ICON = {
  dyadic:'<svg viewBox="0 0 44 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><circle cx="32" cy="12" r="4.2"/><path d="M16.4 12 27.6 12"/></svg>',
  cluster:'<svg viewBox="0 0 44 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="22" cy="12" r="4"/><circle cx="7" cy="6" r="2.6"/><circle cx="7" cy="18" r="2.6"/><circle cx="37" cy="6" r="2.6"/><circle cx="37" cy="18" r="2.6"/><path d="M18.4 10 9.4 6.6M18.4 14 9.4 17.4M25.6 10 34.6 6.6M25.6 14 34.6 17.4"/></svg>',
  chain:'<svg viewBox="0 0 44 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="6" cy="12" r="3.4"/><circle cx="22" cy="12" r="3.4"/><circle cx="38" cy="12" r="3.4"/><path d="M9.4 12 18.6 12M25.4 12 34.6 12"/></svg>'
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const uid = () => Math.random().toString(36).slice(2,9);
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const nowISO = () => new Date().toISOString();
const fmtClock = iso => { try{ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"); }catch(e){ return ""; } };
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mmss(t){ t=Math.max(0,Math.round(t)); return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
const mean = (sum,n)=> n ? sum/n : null;
const fmtMean = m => m==null ? "—" : (Math.round(m*10)/10).toFixed(1);

/* ---------- state ---------- */
const LS_KEY = "grooming_scan_sampler_v1";
const defaultState = () => ({
  version:2,
  speciesList:[
    {name:"Species 1", groups:[]},
    {name:"Species 2", groups:[]},
    {name:"Species 3", groups:[]}
  ],
  defaultInterval:300,
  sessions:[],
  currentSessionId:null,
  activeTab:"record",
  theme:null
});
let state = defaultState();

// Build speciesList from legacy species[]/groups[] on the RAW parsed object,
// before defaults are merged (otherwise the default speciesList would mask it).
function migrateLegacy(p){
  if(p && typeof p==="object" && !Array.isArray(p.speciesList) && (Array.isArray(p.species)||Array.isArray(p.groups))){
    const sp = Array.isArray(p.species) ? p.species : [];
    const gp = Array.isArray(p.groups) ? p.groups : [];
    p.speciesList = sp.map((nm,i)=>({
      name: nm,
      groups: (gp[i] && String(gp[i]).trim()) ? [{name:String(gp[i]).trim(), institution:""}] : []
    }));
  }
  return p;
}
function normConfig(){
  if(!Array.isArray(state.speciesList) || state.speciesList.length===0)
    state.speciesList = defaultState().speciesList;
  state.speciesList = state.speciesList.map(s=>({
    name: (s && s.name!=null) ? String(s.name) : "",
    groups: Array.isArray(s && s.groups) ? s.groups.map(g=>({
      name: (g && g.name!=null) ? String(g.name) : "",
      institution: (g && g.institution!=null) ? String(g.institution) : ""
    })) : []
  }));
  delete state.species; delete state.groups;
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ let p = JSON.parse(raw); if(p && typeof p==="object"){ p = migrateLegacy(p); state = Object.assign(defaultState(), p);
      if(!Array.isArray(state.sessions)) state.sessions = [];
      normConfig();
      state.sessions.forEach(normSession);
    } }
  }catch(e){ /* storage blocked or corrupt — run in memory */ }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------- theme ---------- */
function applyTheme(){
  if(state.theme==="light"||state.theme==="dark") document.documentElement.setAttribute("data-theme", state.theme);
  else document.documentElement.removeAttribute("data-theme");
}
function toggleTheme(){
  const cur = state.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark":"light");
  state.theme = cur==="dark" ? "light":"dark";
  applyTheme(); save();
}

/* ---------- session helpers ---------- */
function curSession(){ return state.sessions.find(s=>s.id===state.currentSessionId) || null; }
function speciesNames(){ return state.speciesList.map(s=>s.name).filter(n=>n && String(n).trim()); }
function speciesEntry(name){ return state.speciesList.find(s=>s.name===name) || null; }
function groupsOf(name){ const e=speciesEntry(name); return e ? e.groups.filter(g=>g.name && String(g.name).trim()) : []; }
function instFor(species, group){ const g = groupsOf(species).find(x=>x.name===group); return g ? (g.institution||"") : ""; }
function speciesWithGroups(){ return state.speciesList.filter(s=> s.name && String(s.name).trim() && s.groups.some(g=>g.name && String(g.name).trim())); }
function normSession(s){
  if(s.elapsedSec==null) s.elapsedSec=0;
  if(s.runningSince===undefined) s.runningSince=null;
  if(s.institution===undefined) s.institution="";
  if(s.groupN===undefined) s.groupN=null;
  if(!s.scanOOV || typeof s.scanOOV!=="object") s.scanOOV={};
  if(!s.startedAt) s.startedAt = (s.events[0] && s.events[0].time) || nowISO();
  if(!s.census) s.census = {start:{sizes:[],time:null}, end:{sizes:[],time:null}};
  if(!s.census.start) s.census.start = {sizes:[],time:null};
  if(!s.census.end) s.census.end = {sizes:[],time:null};
}
function sessElapsed(s){ return (s.elapsedSec||0) + (s.runningSince ? (Date.now()-Date.parse(s.runningSince))/1000 : 0); }
function sessResume(s){ if(s && !s.runningSince) s.runningSince = nowISO(); }
function sessPause(s){ if(s && s.runningSince){ s.elapsedSec = (s.elapsedSec||0) + (Date.now()-Date.parse(s.runningSince))/1000; s.runningSince = null; } }
function censusSub(c){ const sizes=(c&&c.sizes)||[]; return {n:sizes.length, total:sizes.reduce((a,b)=>a+(parseInt(b,10)||0),0), sizes}; }
function totals(sess){
  let dy=0, cl=0, ch=0, clSum=0, clN=0, chSum=0, chN=0;
  sess.events.forEach(e=>{
    if(e.type==="dyadic") dy++;
    else if(e.type==="polyadic"){
      const n = parseInt(e.size,10);
      if(e.subtype==="chain"){ ch++; if(n>=3){ chSum+=n; chN++; } }
      else { cl++; if(n>=3){ clSum+=n; clN++; } }
    }
  });
  return {dyadic:dy, cluster:cl, chain:ch, polyadic:cl+ch, events:sess.events.length, scans:sess.currentScan, clSum, clN, chSum, chN};
}
function groupSummary(){
  const map = new Map();
  state.sessions.forEach(s=>{
    const key = [s.species, s.group||"", s.institution||""].join("\u0000");
    if(!map.has(key)) map.set(key,{species:s.species,group:s.group||"",institution:s.institution||"",sessions:0,scans:0,events:0,dyadic:0,cluster:0,chain:0,clSum:0,clN:0,chSum:0,chN:0});
    const g = map.get(key), t = totals(s);
    g.sessions++; g.scans+=t.scans; g.events+=t.events; g.dyadic+=t.dyadic; g.cluster+=t.cluster; g.chain+=t.chain;
    g.clSum+=t.clSum; g.clN+=t.clN; g.chSum+=t.chSum; g.chN+=t.chN;
  });
  return [...map.values()].sort((a,b)=>
    String(a.species).localeCompare(b.species) ||
    String(a.group).localeCompare(b.group) ||
    String(a.institution).localeCompare(b.institution));
}

/* ---------- mutations ---------- */
let armed = null; // ephemeral: {subtype, size} while choosing a polyadic size
let censusEdit = {start:false, end:false}; // which census editors are open

function addEvent(type, subtype, size){
  const s = curSession(); if(!s) return;
  const ev = { id:uid(), scan:s.currentScan, time:nowISO(), type, subtype:subtype||null, participants:"", notes:"" };
  if(type==="polyadic") ev.size = Math.max(3, parseInt(size,10)||3);
  armed = null;
  s.events.push(ev);
  save(); render(); flashLog();
}
function removeEvent(id){
  const s = curSession(); if(!s) return;
  s.events = s.events.filter(e=>e.id!==id); save(); render();
}
function nextScan(){
  const s = curSession(); if(!s) return;
  s.currentScan++; save(); render();
  toast("Scan "+s.currentScan+" started");
}
function startSession(){
  const sp = $("#f-species").value;
  const gp = $("#f-group") ? $("#f-group").value : "";
  const inst = instFor(sp, gp);
  const ob = $("#f-observer").value.trim();
  const dt = $("#f-date").value || todayStr();
  const nt = $("#f-notes").value.trim();
  const gnRaw = $("#f-groupn") ? $("#f-groupn").value.trim() : "";
  const gn = gnRaw==="" ? null : Math.max(0, parseInt(gnRaw,10)||0);
  const s = { id:uid(), species:sp, group:gp, institution:inst, observer:ob, date:dt, notes:nt,
    groupN:gn, scanOOV:{}, currentScan:1, events:[],
    startedAt:nowISO(), elapsedSec:0, runningSince:nowISO(),
    census:{start:{sizes:[],time:null}, end:{sizes:[],time:null}} };
  state.sessions.unshift(s); state.currentSessionId=s.id;
  censusEdit = {start:true, end:false};
  save(); render();
  toast("Session started");
}
function resumeSession(id){
  state.currentSessionId=id; const s=curSession();
  if(s){ normSession(s); sessResume(s); censusEdit={start:s.census.start.sizes.length===0, end:false}; }
  save(); render();
}
function endSession(){ const s=curSession(); if(s) sessPause(s); state.currentSessionId=null; save(); render(); }
function finishSession(){
  const s=curSession(); if(!s) return;
  if(((s.census.end&&s.census.end.sizes)||[]).length===0){ document.getElementById("endmodal").classList.add("show"); return; }
  endSession(); toast("Session ended");
}
function deleteSession(id){
  const s = state.sessions.find(x=>x.id===id); if(!s) return;
  if(!confirm("Delete this session for "+s.species+" · "+s.group+"?\nThis removes "+s.events.length+" grooming record(s) and cannot be undone.")) return;
  state.sessions = state.sessions.filter(x=>x.id!==id);
  if(state.currentSessionId===id) state.currentSessionId=null;
  save(); render();
}
function editField(id, field, val){
  for(const s of state.sessions){ const e = s.events.find(e=>e.id===id); if(e){
    if(field==="size") e.size = Math.max(3, parseInt(val,10)||3); else e[field]=val;
    save(); return; } }
}

/* ============================ RENDER ============================ */
function render(){
  document.querySelectorAll(".tab").forEach(t=> t.setAttribute("aria-selected", String(t.dataset.tab===state.activeTab)));
  if(state.activeTab==="record") renderRecord();
  else if(state.activeTab==="summary") renderSummary();
  else if(state.activeTab==="data") renderData();
  else renderSettings();
  if(state.activeTab==="record") Timer.mount();
}

/* ---------- Record ---------- */
function renderRecord(){
  const s = curSession();
  if(!s){ renderStart(); return; }
  const t = totals(s);
  const scanEvents = s.events.filter(e=>e.scan===s.currentScan);

  app.innerHTML = `
    <div class="card">
      <div class="sess-banner">
        <div>
          <div class="sess-id"><span class="sp">${esc(s.species)}</span>${s.group?'<span class="gp">'+esc(s.group)+'</span>':''}</div>
          <div class="sess-meta">${s.institution?("<b>"+esc(s.institution)+"</b> · "):""}${s.observer?("Obs. "+esc(s.observer)+" · "):""}<b>${esc(s.date)}</b>${s.notes?(" · "+esc(s.notes)):""}</div>
        </div>
        <div class="sess-clock">
          <div class="clk-lbl">Session time</div>
          <div class="clock-face ${s.runningSince?"run":""}"><span class="dot"></span><span id="sessClock">${fmtDur(sessElapsed(s))}</span></div>
          <div class="btn-row">
            <button class="btn small" data-action="sess-toggle">${s.runningSince?"Pause":"Resume"}</button>
            <button class="btn ghost small" data-action="switch-session">Switch</button>
            <button class="btn small" data-action="end-session">End session</button>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="console">
        <div class="scan-read">
          <div class="lbl">Scan</div>
          <div class="num" id="scanNum">${s.currentScan}</div>
        </div>
        <div class="scan-ctrls">
          <button class="btn accent" data-action="next-scan">Next scan &rarr;</button>
          <div class="scan-note"><b>${scanEvents.length}</b> grooming ${scanEvents.length===1?"bout":"bouts"} logged this scan. Record every bout you see now, then advance. A scan with none is still valid data.</div>
          <div class="counts-row">
            <label class="cfield"><span>Group N today</span>
              <input type="number" min="0" step="1" inputmode="numeric" data-session-n value="${s.groupN!=null?s.groupN:""}" placeholder="—">
            </label>
            <label class="cfield"><span>Not in view (scan ${s.currentScan})</span>
              <input type="number" min="0" step="1" inputmode="numeric" data-scan-oov value="${(s.scanOOV&&s.scanOOV[s.currentScan]!=null)?s.scanOOV[s.currentScan]:""}" placeholder="0">
            </label>
            ${s.groupN!=null?`<div class="cfield inview"><span>In view now</span><b>${Math.max(0, s.groupN - (parseInt(s.scanOOV&&s.scanOOV[s.currentScan],10)||0))}</b><span class="of">of ${s.groupN}</span></div>`:""}
          </div>
        </div>
      </div>

      <div class="timer" id="timerPanel"></div>
    </div>

    ${censusCard("start", s)}

    <div class="card">
      <h2>Log a grooming bout — tap once per bout observed</h2>
      <div class="log-grid">
        <button class="logbtn dy" data-action="log" data-type="dyadic">
          <span class="ico">${ICON.dyadic}</span>
          <span class="t">Dyadic</span>
          <span class="s">Two individuals</span>
          <span class="tally">SESSION <b>${t.dyadic}</b></span>
        </button>
        <button class="logbtn po${armed&&armed.subtype==="cluster"?" armed":""}" data-action="arm" data-sub="cluster">
          <span class="ico">${ICON.cluster}</span>
          <span class="t">Polyadic · Cluster</span>
          <span class="s">3+ converging on one</span>
          <span class="tally">SESSION <b>${t.cluster}</b></span>
        </button>
        <button class="logbtn po${armed&&armed.subtype==="chain"?" armed":""}" data-action="arm" data-sub="chain">
          <span class="ico">${ICON.chain}</span>
          <span class="t">Polyadic · Chain</span>
          <span class="s">3+ in a line, A&ndash;B&ndash;C</span>
          <span class="tally">SESSION <b>${t.chain}</b></span>
        </button>
      </div>
      ${armed ? armPicker() : ""}

      <div style="margin-top:14px">
        <div class="k" style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:7px">This scan (#${s.currentScan})</div>
        <div class="chips" id="chips">
          ${scanEvents.length ? scanEvents.map(chip).join("") : '<span class="empty-scan">No grooming logged yet for this scan.</span>'}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Session tallies</h2>
      <div class="tallies">
        <div class="tally-cell"><div class="k">Scans</div><div class="v">${t.scans}</div></div>
        <div class="tally-cell dyv"><div class="k">Dyadic</div><div class="v">${t.dyadic}</div></div>
        <div class="tally-cell pov"><div class="k">Polyadic</div><div class="v">${t.polyadic}</div><div class="sub">${t.cluster} cluster · ${t.chain} chain</div></div>
        <div class="tally-cell"><div class="k">Total bouts</div><div class="v">${t.events}</div></div>
      </div>
    </div>

    ${censusCard("end", s)}

    ${s.events.length ? sessionLog(s) : ""}
  `;
}

function chip(e){
  const cls = e.type==="dyadic" ? "dy":"po";
  const label = e.type==="dyadic" ? "Dyadic" : ("Poly · "+(e.subtype==="chain"?"chain":"cluster")+" &times;"+(e.size||"?"));
  return `<span class="chip ${cls}">${label}<button class="x" data-action="rm" data-id="${e.id}" aria-label="Remove">&times;</button></span>`;
}

function censusCard(phase, s){
  const c = s.census[phase], sizes = c.sizes;
  const n = sizes.length, total = sizes.reduce((a,b)=>a+(parseInt(b,10)||0),0);
  const editing = censusEdit[phase];
  const title = phase==="start" ? "Start-of-session census" : "End-of-session census";
  const sub = phase==="start" ? "subgroups present at the start" : "subgroups present at the end";

  if(!editing && n>0){
    return `<div class="card"><div class="census-sum">
      <div>
        <div class="census-head">${title}</div>
        <div class="big"><b>${n}</b> subgroup${n===1?"":"s"} · <b>${total}</b> individuals <span class="faint">(sizes: ${sizes.join(", ")})</span></div>
      </div>
      <button class="btn small" data-action="census-edit" data-phase="${phase}">Edit</button>
    </div></div>`;
  }
  if(!editing && n===0){
    return `<div class="card"><div class="census-sum">
      <div>
        <div class="census-head">${title} <span class="faint">${sub}</span></div>
        <div class="census-tot">Not recorded yet.</div>
      </div>
      <button class="btn small ${phase==="start"?"primary":""}" data-action="census-edit" data-phase="${phase}">Record census</button>
    </div></div>`;
  }
  // editor
  const rows = sizes.map((sz,i)=>`
    <div class="subrow">
      <span class="lab">Subgroup ${i+1}</span>
      <input type="number" min="1" step="1" inputmode="numeric" data-census="${phase}" data-idx="${i}" value="${sz}">
      <span class="faint" style="font-size:12px">individuals</span>
      <button class="icobtn" data-action="census-del" data-phase="${phase}" data-idx="${i}" aria-label="Remove subgroup">&times;</button>
    </div>`).join("");
  return `<div class="card"${phase==="end"?' id="endCensus"':''}>
    <div class="census-head">${title} <span class="faint">${sub}</span></div>
    <div class="subrows">${rows || '<div class="census-tot" style="margin:6px 0">No subgroups yet — add one for each cluster of animals you can see.</div>'}</div>
    ${n>0?`<div class="census-tot"><b>${n}</b> subgroup${n===1?"":"s"} · <b>${total}</b> individuals total</div>`:""}
    <div class="btn-row" style="margin-top:12px">
      <button class="btn small" data-action="census-add" data-phase="${phase}">+ Add subgroup</button>
      ${n>0
        ? `<button class="btn small primary" data-action="census-done" data-phase="${phase}">Done</button>`
        : `<button class="btn small ghost" data-action="census-done" data-phase="${phase}">Later</button>`}
    </div>
  </div>`;
}

function armPicker(){
  const st = armed.subtype, name = st==="chain" ? "chain" : "cluster";
  const nums = [3,4,5,6,7,8].map(n=>`<button class="numbtn" data-action="arm-log" data-size="${n}">${n}</button>`).join("");
  return `
    <div class="arm">
      <div class="arm-q"><span class="ico">${st==="chain"?ICON.chain:ICON.cluster}</span>How many individuals in this ${name}?</div>
      <div class="arm-nums">${nums}</div>
      <div class="arm-more">
        <span class="lbl">more:</span>
        <span class="stepper"><button data-action="arm-dec" aria-label="Fewer">&minus;</button><span class="sv">${armed.size}</span><button data-action="arm-inc" aria-label="More">+</button></span>
        <button class="btn primary small" data-action="arm-log" data-size="${armed.size}">Log ${name} of ${armed.size}</button>
        <button class="btn ghost small" data-action="arm-cancel">Cancel</button>
      </div>
    </div>`;
}

function sessionLog(s){
  const rows = [...s.events].sort((a,b)=> a.scan-b.scan || a.time.localeCompare(b.time)).map(e=>`
    <tr>
      <td class="num">${e.scan}</td>
      <td>${e.type==="dyadic"?'<span class="pill dy">dyadic</span>':'<span class="pill po">poly · '+(e.subtype==="chain"?"chain":"cluster")+'</span>'}</td>
      <td>${e.type==="polyadic"
          ? '<input class="icell szcell" type="number" min="3" step="1" data-edit="size" data-id="'+e.id+'" value="'+(e.size||3)+'">'
          : '<span class="mini">2</span>'}</td>
      <td class="mini">${fmtClock(e.time)}</td>
      <td><input class="icell" data-edit="participants" data-id="${e.id}" value="${esc(e.participants)}" placeholder="e.g. AB, CD or A&gt;B"></td>
      <td><input class="icell" data-edit="notes" data-id="${e.id}" value="${esc(e.notes)}" placeholder="note"></td>
      <td><button class="icobtn" data-action="rm" data-id="${e.id}" aria-label="Delete">&times;</button></td>
    </tr>`).join("");
  return `
    <div class="card flush">
      <div style="padding:14px 16px 0"><h2 style="margin:0">Full session log <span class="faint">(${s.events.length})</span></h2>
      <p class="hint" style="margin:6px 0 0">Participant IDs and notes are optional. Everything here goes into the CSV export.</p></div>

/* ============================ TIMER ============================ */
const Timer = (() => {
  let intervalSec = state.defaultInterval, remaining = state.defaultInterval, running=false, autoAdvance=false, handle=null;
  function mount(){
    const panel = $("#timerPanel"); if(!panel) return;
    panel.innerHTML = `
      <div class="timer-head">
        <div class="timer-face" id="tface">${mmss(remaining)}</div>
        <div class="btn-row">
          <button class="btn small" data-action="timer-toggle">${running?"Pause":"Start"} timer</button>
          <button class="btn small ghost" data-action="timer-reset">Reset</button>
        </div>
      </div>
      <div class="timer-bar"><i id="tbar" style="width:${intervalSec?100*remaining/intervalSec:0}%"></i></div>
      <div class="timer-row">
        <span class="timer-set">Interval <input type="number" min="5" step="5" id="tinterval" value="${intervalSec}"> s</span>
        <label class="chk"><input type="checkbox" id="tauto" ${autoAdvance?"checked":""}> auto-advance scan</label>
      </div>`;
    panel.querySelector("#tinterval").addEventListener("change", e=>{
      const v = Math.max(5, parseInt(e.target.value,10)||intervalSec);
      intervalSec=v; if(!running){ remaining=v; paint(); }
    });
    panel.querySelector("#tauto").addEventListener("change", e=> autoAdvance=e.target.checked);
  }
  function paint(){
    const f=$("#tface"), b=$("#tbar");
    if(f) f.textContent = mmss(remaining);
    if(b) b.style.width = (intervalSec?100*Math.max(0,remaining)/intervalSec:0)+"%";
  }
  function tick(){
    remaining--; paint();
    if(remaining<=0){
      beep(); const card=$("#timerPanel")?.closest(".card"); if(card){ card.classList.remove("due"); void card.offsetWidth; card.classList.add("due"); }
      if(autoAdvance){ remaining=intervalSec; nextScan(); }
      else { running=false; if(handle){clearInterval(handle);handle=null;} remaining=0; toast("Scan due — advance when ready"); mountSafe(); }
    }
  }
  function toggle(){
    if(running){ running=false; if(handle){clearInterval(handle);handle=null;} }
    else { if(remaining<=0) remaining=intervalSec; running=true; handle=setInterval(tick,1000); }
    mountSafe();
  }
  function reset(){ remaining=intervalSec; if(!running){} paint(); mountSafe(); }
  function mountSafe(){ if(state.activeTab==="record" && curSession()) mount(); }
  function setDefault(v){ intervalSec=v; if(!running) remaining=v; }
  return { mount, toggle, reset, setDefault, mountSafe };
})();

function beep(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    const ctx = new Ctx(); const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.5); setTimeout(()=>ctx.close(),700);
  }catch(e){}
}

function csvCell(v){ v = v==null?"":String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(",")).join("\r\n"); }

function eventsCSV(){
  const head = ["session_id","species","group","institution","observer","date","scan_number","event_time","event_id","grooming_type","polyadic_subtype","n_individuals","participants","notes"];
  const rows = [head];
  state.sessions.forEach(s=> s.events.forEach(e=>{
    const n = e.type==="dyadic" ? 2 : (parseInt(e.size,10)||"");
    rows.push([s.id,s.species,s.group,s.institution||"",s.observer,s.date,e.scan,e.time,e.id,e.type,e.type==="polyadic"?(e.subtype||"cluster"):"",n,e.participants,e.notes]);
  }));
  return toCSV(rows);
}
function scansCSV(){
  const head = ["session_id","species","group","institution","date","scan_number","n_not_in_view","group_N_today","n_in_view","n_bouts","n_dyadic","n_polyadic","n_cluster","n_chain"];
  const rows = [head];
  state.sessions.forEach(s=>{
    const per = {};
    s.events.forEach(e=>{
      const k=e.scan; if(!per[k]) per[k]={b:0,dy:0,po:0,cl:0,ch:0};
      per[k].b++;
      if(e.type==="dyadic") per[k].dy++;
      else { per[k].po++; if(e.subtype==="chain") per[k].ch++; else per[k].cl++; }
    });
    const N = (s.groupN!=null) ? s.groupN : null;
    for(let k=1;k<=s.currentScan;k++){
      const raw = s.scanOOV ? s.scanOOV[k] : undefined;
      const oov = (raw===undefined||raw===null||raw==="") ? "" : Math.max(0, parseInt(raw,10)||0);
      const inView = (N!=null) ? Math.max(0, N - (oov===""?0:oov)) : "";
      const p = per[k] || {b:0,dy:0,po:0,cl:0,ch:0};
      rows.push([s.id,s.species,s.group,s.institution||"",s.date,k,oov,(N!=null?N:""),inView,p.b,p.dy,p.po,p.cl,p.ch]);
    }
  });
  return toCSV(rows);
}
function summaryCSV(){
  const head = ["species","group","institution","sessions","total_scans","total_bouts","dyadic","polyadic","polyadic_cluster","polyadic_chain","mean_cluster_size","mean_chain_size"];
  const rows = [head];
  groupSummary().forEach(g=>{
    const cm = g.clN ? Math.round(g.clSum/g.clN*100)/100 : "";
    const hm = g.chN ? Math.round(g.chSum/g.chN*100)/100 : "";
    rows.push([g.species,g.group,g.institution,g.sessions,g.scans,g.events,g.dyadic,g.cluster+g.chain,g.cluster,g.chain,cm,hm]);
  });
  return toCSV(rows);
}
function sessionsCSV(){
  const head = ["session_id","species","group","institution","observer","date","started_at","duration_sec","duration_hms","group_N_today","grooming_scans","dyadic","polyadic","polyadic_cluster","polyadic_chain","start_n_subgroups","start_individuals","end_n_subgroups","end_individuals"];
  const rows = [head];
  state.sessions.forEach(s=>{
    const t = totals(s), dur = Math.round(sessElapsed(s));
    const cs = censusSub(s.census&&s.census.start), ce = censusSub(s.census&&s.census.end);
    rows.push([s.id,s.species,s.group,s.institution||"",s.observer,s.date,s.startedAt||"",dur,fmtDur(dur),(s.groupN!=null?s.groupN:""),t.scans,t.dyadic,t.polyadic,t.cluster,t.chain,cs.n,cs.total,ce.n,ce.total]);
  });
  return toCSV(rows);
}
function censusCSV(){
  const head = ["session_id","species","group","institution","date","phase","census_time","n_subgroups","subgroup_index","subgroup_size"];
  const rows = [head];
  state.sessions.forEach(s=>{
    ["start","end"].forEach(ph=>{
      const c = s.census && s.census[ph]; const sizes = (c&&c.sizes)||[];
      sizes.forEach((sz,i)=> rows.push([s.id,s.species,s.group,s.institution||"",s.date,ph,(c&&c.time)||"",sizes.length,i+1,sz]));
    });
  });
  return toCSV(rows);
}

async function offerFile(filename, text){
  // 1) claude.ai hosted downloads capability, when present
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const dl = await window.claude.use("downloads");
      if(dl){
        try{ await dl.save({filename, data:text}); toast("Saved "+filename); return; }
        catch(err){ if(err && err.code==="declined"){ return; } /* else fall through */ }
      }
    }
  }catch(e){}
  // 2) standard blob download (works when run locally / most hosts)
  try{
    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 120);
    toast("Downloaded "+filename); return;
  }catch(e){}
  // 3) last resort — show text so nothing is ever trapped
  showModal(filename, "Copy this and save it as "+filename, text);
}

let modalText="";
function showModal(title,msg,text){
  modalText=text; $("#modalTitle").textContent=title; $("#modalMsg").textContent=msg||"";
  $("#modalText").value=text; $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); }
async function copyModal(){
  try{ await navigator.clipboard.writeText(modalText); toast("Copied"); }
  catch(e){ const ta=$("#modalText"); ta.focus(); ta.select(); try{document.execCommand("copy"); toast("Copied");}catch(_){ toast("Press Ctrl/Cmd-C","err"); } }
}

/* ============================ EVENTS ============================ */
document.addEventListener("click", e=>{
  if(e.target.id==="endmodal"){ e.target.classList.remove("show"); return; }
  if(e.target.id==="modal"){ e.target.classList.remove("show"); return; }
  const tab = e.target.closest(".tab");
  if(tab){ state.activeTab=tab.dataset.tab; save(); render(); return; }
  if(e.target.closest("#themeBtn")){ toggleTheme(); return; }

  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case "log": addEvent(el.dataset.type, el.dataset.sub||null); break;
    case "arm": armed = {subtype:el.dataset.sub, size:(armed&&armed.subtype===el.dataset.sub?armed.size:3)}; render(); break;
    case "arm-log": addEvent("polyadic", armed?armed.subtype:el.dataset.sub, el.dataset.size); break;
    case "arm-inc": if(armed){ armed.size++; render(); } break;
    case "arm-dec": if(armed){ armed.size=Math.max(3,armed.size-1); render(); } break;
    case "arm-cancel": armed=null; render(); break;
    case "rm": removeEvent(el.dataset.id); break;
    case "next-scan": nextScan(); break;
    case "sess-toggle": { const s=curSession(); if(s){ if(s.runningSince) sessPause(s); else sessResume(s); save(); render(); } break; }
    case "census-edit": censusEdit[el.dataset.phase]=true; render(); break;
    case "census-done": censusEdit[el.dataset.phase]=false; render(); break;
    case "census-add": { const s=curSession(); if(s){ const c=s.census[el.dataset.phase]; c.sizes.push(1); if(!c.time) c.time=nowISO(); censusEdit[el.dataset.phase]=true; save(); render(); } break; }
    case "census-del": { const s=curSession(); if(s){ s.census[el.dataset.phase].sizes.splice(+el.dataset.idx,1); save(); render(); } break; }
    case "start-session": startSession(); break;
    case "end-session": endSession(); break;
    case "end-session": finishSession(); break;
    case "switch-session": endSession(); break;
    case "end-cancel": document.getElementById("endmodal").classList.remove("show"); break;
    case "end-anyway": document.getElementById("endmodal").classList.remove("show"); endSession(); toast("Session ended"); break;
    case "end-record": {
      document.getElementById("endmodal").classList.remove("show");
      censusEdit.end=true; render();
      setTimeout(()=>{ const el=document.getElementById("endCensus"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }, 60);
      break;
    }
    case "resume": resumeSession(el.dataset.id); break;
    case "del-session": deleteSession(el.dataset.id); break;
    case "goto-settings": state.activeTab="settings"; save(); render(); break;
    case "timer-toggle": Timer.toggle(); break;
    case "timer-reset": Timer.reset(); break;
    case "species-add": commitConfigInputs(); state.speciesList.push({name:"",groups:[]}); save(); render(); break;
    case "species-del": {
      commitConfigInputs();
      const si = +el.dataset.si;
      if(state.speciesList.length<=1) break;
      const sp = state.speciesList[si]; const nm = sp ? sp.name : "";
      const used = state.sessions.filter(s=>s.species===nm).length;
      if(used>0 && !confirm('"'+(nm||("Species "+(si+1)))+'" has '+used+' recorded session'+(used===1?"":"s")+'. Removing it keeps that data but it will no longer be selectable. Remove it?')) break;
      state.speciesList.splice(si,1); save(); render(); break;
    }
    case "group-add": {
      commitConfigInputs();
      const sp = state.speciesList[+el.dataset.si];
      if(sp){ if(!Array.isArray(sp.groups)) sp.groups=[]; sp.groups.push({name:"",institution:""}); }
      save(); render(); break;
    }
    case "group-del": {
      commitConfigInputs();
      const sp = state.speciesList[+el.dataset.si]; if(!sp) break;
      const gi = +el.dataset.gi, g = sp.groups[gi];
      const used = state.sessions.filter(s=>s.species===sp.name && s.group===(g&&g.name)).length;
      if(used>0 && !confirm('Group "'+((g&&g.name)||"")+'" has '+used+' recorded session'+(used===1?"":"s")+'. Removing it keeps that data but it will no longer be selectable. Remove it?')) break;
      sp.groups.splice(gi,1); save(); render(); break;
    }
    case "save-config": {
      commitConfigInputs();
      state.speciesList = state.speciesList.map((s,i)=>({
        name: (s.name||"").trim() || ("Species "+(i+1)),
        groups: (s.groups||[]).map(g=>({name:(g.name||"").trim(), institution:(g.institution||"").trim()})).filter(g=>g.name)
      }));
      save(); toast("Saved"); render(); break;
    }
    case "save-interval": {
      const v=Math.max(5, parseInt($("#def-interval").value,10)||state.defaultInterval);
      state.defaultInterval=v; Timer.setDefault(v); save(); toast("Interval saved"); break;
    }
    case "export-events": offerFile("grooming_bouts_"+stamp()+".csv", eventsCSV()); break;
    case "export-scans": offerFile("grooming_scans_"+stamp()+".csv", scansCSV()); break;
    case "export-sessions": offerFile("grooming_sessions_"+stamp()+".csv", sessionsCSV()); break;
    case "export-summary": offerFile("grooming_group_summary_"+stamp()+".csv", summaryCSV()); break;
    case "export-census": offerFile("grooming_subgroup_census_"+stamp()+".csv", censusCSV()); break;
    case "export-backup": offerFile("grooming_backup_"+stamp()+".json", JSON.stringify(state,null,2)); break;
    case "clear-all":
      if(confirm("Erase ALL sessions and bouts from this browser? This cannot be undone.\nExport a backup first if you want to keep the data.")){
        state = defaultState(); save(); toast("All data erased"); render();
      }
      break;
    case "modal-close": closeModal(); break;
    case "modal-copy": copyModal(); break;
  }
});

document.addEventListener("change", e=>{
  const sn = e.target.closest("[data-session-n]");
  if(sn){ const s=curSession(); if(s){ const v=sn.value.trim(); s.groupN = v===""?null:Math.max(0,parseInt(v,10)||0); save(); render(); } return; }
  const oov = e.target.closest("[data-scan-oov]");
  if(oov){ const s=curSession(); if(s){ const v=oov.value.trim(); if(!s.scanOOV) s.scanOOV={};
    if(v==="") delete s.scanOOV[s.currentScan]; else s.scanOOV[s.currentScan]=Math.max(0,parseInt(v,10)||0);
    save(); render(); } return; }
  const cen = e.target.closest("input[data-census]");
  if(cen){ const s=curSession(); if(s){ const arr=s.census[cen.dataset.census].sizes; arr[+cen.dataset.idx]=Math.max(1,parseInt(cen.value,10)||1); save(); render(); } return; }
  const inp = e.target.closest("input[data-edit]");
  if(inp){ editField(inp.dataset.id, inp.dataset.edit, inp.value); if(inp.dataset.edit==="size") render(); return; }
  const file = e.target.closest("#import-file");
  if(file && file.files && file.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const p = JSON.parse(reader.result);
        if(!p || typeof p!=="object" || !Array.isArray(p.sessions)) throw new Error("bad");
        if(!confirm("Replace all current data with this backup? "+p.sessions.length+" session(s) will be loaded.")) return;
        state = Object.assign(defaultState(), migrateLegacy(p)); if(!Array.isArray(state.sessions)) state.sessions=[]; normConfig(); state.sessions.forEach(normSession); state.currentSessionId=null; applyTheme(); save(); render(); toast("Backup restored");
      }catch(err){ toast("That file isn't a valid backup","err"); }
    };
    reader.readAsText(file.files[0]);
  }
});

/* ============================ INIT ============================ */
load(); applyTheme(); Timer.setDefault(state.defaultInterval);
if(!["record","summary","data","settings"].includes(state.activeTab)) state.activeTab="record";
render();

// live whole-session clock (updates the display only; state math is timestamp-based)
setInterval(()=>{
  const el = document.getElementById("sessClock"); if(!el) return;
  const s = curSession(); if(!s || !s.runningSince) return;
  el.textContent = fmtDur(sessElapsed(s));
}, 1000);
</script>
