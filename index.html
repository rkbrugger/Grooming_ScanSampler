<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan Sampler — grooming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EDE7; --surface:#F8FAF6; --surface-2:#FFFFFF;
    --ink:#16211C; --ink-2:#55635B; --line:#CFD8CF; --line-2:#E0E6DE;
    --brand:#0F6F5B; --brand-ink:#FFFFFF; --brand-soft:#DCEBE5;
    --alert:#C8791B; --alert-ink:#FFFFFF; --alert-soft:#F6E7CF;
    --danger:#A6402F; --danger-soft:#F1DCD6;
    --shadow:0 1px 2px rgba(20,33,28,.06), 0 6px 20px rgba(20,33,28,.05);
    --radius:12px; --radius-lg:16px;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0E1512; --surface:#16201B; --surface-2:#1C2822;
      --ink:#E7EEE8; --ink-2:#9AA8A0; --line:#2A362F; --line-2:#212B25;
      --brand:#2FBFA0; --brand-ink:#06231D; --brand-soft:#123029;
      --alert:#E8A23C; --alert-ink:#221604; --alert-soft:#33260F;
      --danger:#E0765F; --danger-soft:#331C17;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1512; --surface:#16201B; --surface-2:#1C2822;
    --ink:#E7EEE8; --ink-2:#9AA8A0; --line:#2A362F; --line-2:#212B25;
    --brand:#2FBFA0; --brand-ink:#06231D; --brand-soft:#123029;
    --alert:#E8A23C; --alert-ink:#221604; --alert-soft:#33260F;
    --danger:#E0765F; --danger-soft:#331C17;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  button{font-family:inherit; cursor:pointer}
  input,select{font-family:inherit; font-size:16px}
  a{color:var(--brand)}

  .wrap{max-width:600px; margin:0 auto; padding:0 16px 40px}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; gap:10px;
    padding:14px 16px 12px; max-width:600px; margin:0 auto;
    border-bottom:1px solid var(--line-2);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .topbar .mark{
    font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:-.01em;
    display:flex; align-items:center; gap:8px;
  }
  .topbar .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
  .topbar .spacer{flex:1}
  .iconbtn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    width:38px;height:38px;border-radius:10px; display:grid;place-items:center;
    font-size:16px; line-height:1;
  }
  .iconbtn:hover{border-color:var(--brand)}

  h1.page{font-family:var(--disp); font-weight:600; font-size:26px; letter-spacing:-.02em; margin:22px 0 4px}
  .sub{color:var(--ink-2); font-size:14px; margin:0 0 20px}

  .panel{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--shadow);
  }
  .panel + .panel{margin-top:14px}
  .pad{padding:16px}

  .rowlabel{font-family:var(--disp); font-weight:500; font-size:12.5px; letter-spacing:.02em;
    color:var(--ink-2); display:flex; align-items:center; gap:8px; margin:26px 2px 10px}
  .rowlabel::after{content:""; flex:1; height:1px; background:var(--line-2)}

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:12px 16px; border-radius:12px; font-weight:600; font-size:15px;
    min-height:48px; width:100%;
  }
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.alert{background:var(--alert); color:var(--alert-ink); border-color:var(--alert)}
  .btn.ghost{background:transparent}
  .btn.small{min-height:40px; padding:9px 12px; font-size:14px; width:auto}
  .btn.danger{color:var(--danger); border-color:var(--danger)}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btnrow{display:flex; gap:10px}
  .btnrow .btn{width:auto; flex:1}

  /* forms */
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface-2); color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand)}
  .field .hint{font-size:12px; color:var(--ink-2); margin-top:5px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line-2)}
  .toggle .t-label{font-size:14px}
  .toggle .t-label small{display:block; color:var(--ink-2); font-size:12px; font-weight:400}
  .switch{position:relative; width:46px; height:28px; flex:none}
  .switch input{opacity:0; width:0; height:0; position:absolute}
  .switch span{position:absolute; inset:0; background:var(--line); border-radius:99px; transition:background .15s}
  .switch span::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .switch input:checked + span{background:var(--brand)}
  .switch input:checked + span::after{transform:translateX(18px)}
  .switch input:focus-visible + span{outline:2px solid var(--brand); outline-offset:2px}

  /* session list */
  .sess{display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left; width:100%;
    border:none; background:none; color:inherit; border-bottom:1px solid var(--line-2)}
  .sess:last-child{border-bottom:none}
  .sess:hover{background:var(--surface-2)}
  .sess .sp{width:6px; align-self:stretch; border-radius:99px; flex:none}
  .sess .meta{flex:1; min-width:0}
  .sess .meta .t{font-family:var(--disp); font-weight:600; font-size:16px; letter-spacing:-.01em}
  .sess .meta .d{color:var(--ink-2); font-size:13px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sess .cnt{font-family:var(--disp); text-align:right; flex:none}
  .sess .cnt b{display:block; font-size:20px; font-weight:600}
  .sess .cnt small{color:var(--ink-2); font-size:11px}
  .chev{color:var(--ink-2); font-size:18px; flex:none}

  .empty{text-align:center; padding:44px 20px; color:var(--ink-2)}
  .empty .big{font-size:40px; margin-bottom:10px}

  /* observe */
  .obs-head{display:flex; align-items:flex-start; gap:12px; margin:18px 0 6px}
  .obs-head .who{flex:1; min-width:0}
  .obs-head .who .t{font-family:var(--disp); font-weight:600; font-size:22px; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .obs-head .who .s{color:var(--ink-2); font-size:13px}
  .scannum{font-family:var(--disp); font-weight:600; color:var(--ink-2); font-size:14px; margin-bottom:14px}
  .scannum b{color:var(--ink); font-size:16px}

  .timer{
    border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-lg);
    text-align:center; padding:22px 16px; box-shadow:var(--shadow); transition:background .2s,border-color .2s;
  }
  .timer .clock{font-family:var(--disp); font-weight:700; font-size:56px; line-height:1; letter-spacing:-.01em}
  .timer .cap{font-size:13px; color:var(--ink-2); margin-top:8px; font-weight:600}
  .timer.due{background:var(--alert); border-color:var(--alert); color:var(--alert-ink); animation:pulse 1s ease-in-out infinite}
  .timer.due .cap{color:var(--alert-ink)}
  .timer.paused{opacity:.7}
  @keyframes pulse{0%,100%{box-shadow:var(--shadow)} 50%{box-shadow:0 0 0 6px var(--alert-soft)}}
  @media (prefers-reduced-motion: reduce){ .timer.due{animation:none} }
  .timer-ctl{display:flex; gap:10px; margin-top:12px}
  .timer-ctl .btn{width:auto; flex:1; min-height:44px}

  .beh{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line-2)}
  .beh:last-child{border-bottom:none}
  .beh .name{flex:1; font-size:15.5px; font-weight:500}
  .stepper{display:flex; align-items:center; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px}
  .stepper button{
    width:46px; height:46px; border-radius:9px; border:none; background:transparent; color:var(--ink);
    font-size:26px; font-weight:600; line-height:1; display:grid; place-items:center;
  }
  .stepper button:hover{background:var(--brand-soft)}
  .stepper button:active{background:var(--brand); color:var(--brand-ink)}
  .stepper .val{font-family:var(--disp); font-weight:600; font-size:22px; min-width:40px; text-align:center}
  .stepper .val.zero{color:var(--ink-2)}

  .tally{display:flex; align-items:baseline; justify-content:space-between; margin:16px 2px 4px; font-size:14px; color:var(--ink-2)}
  .tally b{font-family:var(--disp); color:var(--ink); font-size:18px; font-weight:600}
  .tally .over{color:var(--danger)}

  .sticky-save{position:sticky; bottom:0; padding:14px 0 calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 72%, transparent); margin-top:8px}

  /* data table */
  .tablescroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; width:100%; font-size:13.5px}
  th,td{padding:9px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line-2)}
  th{font-family:var(--disp); font-weight:600; font-size:12px; color:var(--ink-2); position:sticky; top:0; background:var(--surface)}
  td.n{text-align:right; font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--surface-2)}

  /* editable behaviour list (setup/settings) */
  .editrow{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .editrow input{flex:1}
  .editrow .del{width:40px; height:40px; flex:none; border:1px solid var(--line); background:var(--surface); border-radius:10px; color:var(--danger); font-size:18px; display:grid; place-items:center}
  .editrow .del:hover{background:var(--danger-soft)}

  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(10,15,13,.5); display:grid; place-items:center; padding:18px; z-index:50}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); max-width:520px; width:100%; max-height:86vh; overflow:auto; box-shadow:var(--shadow)}
  .modal .m-pad{padding:18px}
  .modal h3{font-family:var(--disp); margin:0 0 6px; font-size:19px; font-weight:600}
  .modal p.m-sub{color:var(--ink-2); font-size:13.5px; margin:0 0 14px}
  textarea.csv{width:100%; height:200px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--surface-2); color:var(--ink); white-space:pre; overflow:auto}

  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{border:none; background:var(--surface); color:var(--ink-2); padding:8px 14px; font-size:13px; font-weight:600}
  .seg button.on{background:var(--brand); color:var(--brand-ink)}

  /* structured (polyadic) behaviours during observation */
  .beh-struct{padding:14px 4px; border-bottom:1px solid var(--line-2)}
  .beh-struct:last-child{border-bottom:none}
  .beh-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
  .beh-head .name{font-size:15.5px; font-weight:500}
  .beh-head .sumcount{font-family:var(--disp); font-size:13px; color:var(--ink-2)}
  .beh-head .sumcount b{color:var(--ink); font-weight:600; font-size:16px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
  .chip{display:inline-flex; align-items:center; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:3px 5px 3px 12px}
  .chip .ct{font-size:13px; font-weight:600}
  .chip .ct.cluster{color:var(--brand)}
  .chip .ct.chain{color:var(--alert)}
  .chip .msize{display:inline-flex; align-items:center}
  .chip .msize button{width:30px; height:30px; border:none; background:transparent; color:var(--ink); font-size:19px; font-weight:600; border-radius:7px; line-height:1}
  .chip .msize button:hover{background:var(--brand-soft)}
  .chip .msize .sv{min-width:22px; text-align:center; font-size:15px}
  .chip .rm{width:26px; height:26px; border:none; background:transparent; color:var(--danger); font-size:16px; border-radius:6px; line-height:1}
  .chip .rm:hover{background:var(--danger-soft)}
  .chip.empty-note{background:none; border:none; color:var(--ink-2); font-size:13px; padding-left:2px}
  .addrow{display:flex; gap:8px}
  .addrow button{flex:1; border:1px dashed var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:10px; font-size:14px; font-weight:600}
  .addrow button:hover{border-color:var(--brand); border-style:solid}
  .addrow button .k{color:var(--ink-2); font-weight:400; font-size:12px}
  /* behaviour list editor (setup + settings) */
  .beh-edit{border:1px solid var(--line-2); border-radius:10px; padding:8px 8px 2px; margin-bottom:8px; background:var(--surface-2)}
  .beh-edit.is-struct{border-color:var(--brand)}
  .beh-edit .top{display:flex; gap:8px; align-items:center}
  .beh-edit .top input{flex:1}
  .beh-edit .opt{display:flex; align-items:center; gap:10px; margin:8px 2px; cursor:pointer}
  .beh-edit .opt-l{font-size:13px; color:var(--ink-2)}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:14px; font-weight:600;
    transition:opacity .2s, transform .2s; z-index:60; pointer-events:none; max-width:88vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  :focus-visible{outline:2px solid var(--brand); outline-offset:2px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="mark"><span class="dot"></span> Scan Sampler</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btn-home" title="Sessions" aria-label="Sessions">☰</button>
    <button class="iconbtn" id="btn-theme" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    <button class="iconbtn" id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>
  <main class="wrap" id="app"></main>
  <div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  var STORE_KEY = "grooming-scan-v1";
  var THEME_KEY = "grooming-scan-theme";
  // rev 2026-10-16b: groups+institution registry; per-session N present; per-scan not-in-view

  var DEFAULTS = {
    species: ["Species A", "Species B", "Species C"],
    institutions: [],   // e.g. "Zoo Zürich", "Zoo Basel"
    groups: [],         // {id, name, species, institution, groupSize}
    ethogram: [
      {name:"Dyadic grooming", structured:false},
      {name:"Polyadic grooming", structured:true},
      {name:"Autogrooming", structured:false},
      {name:"Feeding", structured:false},
      {name:"Resting", structured:false},
      {name:"Moving", structured:false},
      {name:"Other", structured:false},
      {name:"Out of sight", structured:false}
    ],
    interval: 300,        // seconds between scans
    sound: true,
    carry: false,         // start each scan from previous counts
    trackNIV: true,       // record animals not in view each scan
    sessions: []
  };

  var state = load();
  var view = { name:"home", sessionId:null };

  // ---- live-observation runtime (not persisted directly except via session) ----
  var live = null; // { session, counts:{}, remaining, awaiting, paused, tickHandle, audio, wakeLock }

  // ---------- storage ----------
  function normBeh(arr){
    if(!Array.isArray(arr)) return [];
    return arr.map(function(b){
      if(typeof b==="string") return {name:b, structured:false};
      return {name:(b&&b.name)||"", structured:!!(b&&b.structured)};
    });
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return clone(DEFAULTS);
      var d = JSON.parse(raw);
      // fill any missing top-level keys
      for(var k in DEFAULTS){ if(!(k in d)) d[k] = clone(DEFAULTS[k]); }
      if(!Array.isArray(d.sessions)) d.sessions = [];
      if(!Array.isArray(d.institutions)) d.institutions=[];
      if(!Array.isArray(d.groups)) d.groups=[];
      d.ethogram = normBeh(d.ethogram);
      d.sessions.forEach(function(s){
        s.behaviours = normBeh(s.behaviours);
        if(!Array.isArray(s.scans)) s.scans=[];
        if(s.institution==null) s.institution = s.location || "";  // migrate old "location" into institution
        if(s.nPresent==null && s.groupSize!=null) s.nPresent = s.groupSize; // N present that day
      });
      return d;
    }catch(e){ return clone(DEFAULTS); }
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ toast("Couldn't save — storage may be full or blocked"); }
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  // ---------- helpers ----------
  function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
  function fmtDate(iso){ try{ var d=new Date(iso); return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return iso; } }
  function fmtDateTime(iso){ try{ var d=new Date(iso); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(e){ return iso; } }
  function speciesColor(name){
    var list = state.species;
    var i = list.indexOf(name); if(i<0) i = Math.abs(hash(name))%3;
    var hues = [ getVar("--brand"), getVar("--alert"), "#5B7CB0" ];
    // deterministic hue from a small palette
    var pal = ["#0F6F5B","#C8791B","#4E6E9E","#8A5A9E","#B0553A","#3E8A5E"];
    return pal[(state.species.indexOf(name)+6)%pal.length] || pal[Math.abs(hash(name))%pal.length];
  }
  function getVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function hash(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return h; }

  var toastT;
  function toast(msg){
    var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- navigation ----------
  function go(name, sessionId){
    // leaving observe: stop timer + release wake lock (session data is already persisted)
    if(view.name==="observe" && name!=="observe") stopLive(false);
    view = { name:name, sessionId: sessionId||null };
    render();
    window.scrollTo(0,0);
  }

  document.getElementById("btn-home").onclick=function(){ go("home"); };
  document.getElementById("btn-settings").onclick=function(){ go("settings"); };
  document.getElementById("btn-theme").onclick=toggleTheme;

  // ---------- theme ----------
  function applyTheme(){
    var t = localStorage.getItem(THEME_KEY);
    if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
    else document.documentElement.removeAttribute("data-theme");
  }
  function toggleTheme(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur==="dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    document.documentElement.setAttribute("data-theme", next);
  }
  applyTheme();

  // ================= VIEWS =================
  function render(){
    var app=document.getElementById("app");
    app.innerHTML="";
    if(view.name==="home") return renderHome(app);
    if(view.name==="setup") return renderSetup(app);
    if(view.name==="observe") return renderObserve(app);
    if(view.name==="data") return renderData(app);
    if(view.name==="settings") return renderSettings(app);
  }

  // ---------- HOME ----------
  function renderHome(app){
    app.appendChild(el('<h1 class="page">Sessions</h1>'));
    app.appendChild(el('<p class="sub">Record scans in the field, then export as CSV.</p>'));

    var start = el('<button class="btn primary">＋ New session</button>');
    start.onclick=function(){ go("setup"); };
    app.appendChild(start);

    if(state.sessions.length===0){
      app.appendChild(el(
        '<div class="panel" style="margin-top:16px"><div class="empty">'+
        '<div class="big">🐾</div>'+
        '<div>No sessions yet.</div>'+
        '<div style="font-size:13px;margin-top:4px">Start one to begin recording scans.</div>'+
        '</div></div>'));
      return;
    }

    var listp = el('<div class="panel" style="margin-top:16px"></div>');
    // newest first
    var sorted = state.sessions.slice().sort(function(a,b){ return (b.startedAt||"").localeCompare(a.startedAt||""); });
    sorted.forEach(function(s){
      var row = el('<button class="sess"></button>');
      row.innerHTML =
        '<span class="sp" style="background:'+speciesColor(s.species)+'"></span>'+
        '<span class="meta"><span class="t">'+esc(s.group||"Untitled group")+'</span>'+
        '<span class="d">'+esc(s.species)+(s.institution?' · '+esc(s.institution):'')+' · '+fmtDate(s.startedAt)+'</span></span>'+
        '<span class="cnt num"><b>'+s.scans.length+'</b><small>scans</small></span>'+
        '<span class="chev">›</span>';
      row.onclick=function(){ go("data", s.id); };
      listp.appendChild(row);
    });
    app.appendChild(listp);

    var exp = el('<button class="btn ghost" style="margin-top:16px">Export all sessions (CSV)</button>');
    exp.onclick=function(){ openExport(state.sessions, "all-sessions"); };
    app.appendChild(exp);
  }

  // ---------- SETUP (new session) ----------
  function renderSetup(app){
    app.appendChild(el('<h1 class="page">New session</h1>'));
    app.appendChild(el('<p class="sub">Set the group and scan interval. Behaviours are saved with this session.</p>'));

    // working ethogram copy for this session (deep copy of objects)
    var eth = state.ethogram.map(function(b){ return {name:b.name, structured:!!b.structured}; });

    // ---- where: pick an existing group (carries its species + institution) or make a new one ----
    var sel = {
      groupId: (state.groups[0] ? state.groups[0].id : "__new"),
      ng: { name:"", species:(state.species[0]||""), institution:"" },
      newInst: false
    };
    app.appendChild(el('<div class="rowlabel">Group</div>'));
    var wherePanel = el('<div class="panel pad"></div>');
    app.appendChild(wherePanel);
    app.appendChild(el('<p class="sub" style="margin-top:8px;font-size:12px">A group belongs to one species at one institution. Reuse the same group across its sessions so labels stay consistent.</p>'));

    function instOptions(selected){
      return state.institutions.map(function(it){ return '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; }).join("")
        + '<option value="__newinst">＋ New institution…</option>';
    }
    function drawWhere(){
      wherePanel.innerHTML="";
      var gWrap=el('<div class="field" style="margin:0"><label>Group</label></div>');
      var gSel=el('<select id="f-groupsel"></select>');
      state.groups.forEach(function(g){
        var o=el('<option value="'+esc(g.id)+'">'+esc(g.name)+' · '+esc(g.species)+(g.institution?' · '+esc(g.institution):'')+'</option>');
        if(g.id===sel.groupId) o.selected=true; gSel.appendChild(o);
      });
      var oNew=el('<option value="__new">＋ New group…</option>'); if(sel.groupId==="__new") oNew.selected=true; gSel.appendChild(oNew);
      gSel.onchange=function(){ sel.groupId=gSel.value; sel.newInst=false; drawWhere(); syncSize(); };
      gWrap.appendChild(gSel); wherePanel.appendChild(gWrap);

      if(sel.groupId==="__new"){
        var spOpts=state.species.map(function(sp){ return '<option value="'+esc(sp)+'"'+(sp===sel.ng.species?' selected':'')+'>'+esc(sp)+'</option>'; }).join("");
        var sub=el('<div style="margin-top:12px"></div>');
        sub.innerHTML =
          '<div class="field"><label>New group name</label><input id="f-ngname" placeholder="e.g. Troop B" autocomplete="off" value="'+esc(sel.ng.name)+'"></div>'+
          '<div class="grid2">'+
            '<div class="field" style="margin:0"><label>Species</label><select id="f-ngspecies">'+spOpts+'</select></div>'+
            '<div class="field" style="margin:0"><label>Institution</label><select id="f-nginst">'+instOptions(sel.ng.institution)+'</select></div>'+
          '</div>';
        wherePanel.appendChild(sub);
        var nameI=sub.querySelector("#f-ngname"); nameI.oninput=function(){ sel.ng.name=nameI.value; };
        var spI=sub.querySelector("#f-ngspecies"); spI.onchange=function(){ sel.ng.species=spI.value; };
        var instI=sub.querySelector("#f-nginst");
        instI.onchange=function(){ if(instI.value==="__newinst"){ sel.newInst=true; sel.ng.institution=""; drawWhere(); } else { sel.ng.institution=instI.value; } };
        if(sel.newInst){
          var nf=el('<div class="field" style="margin-top:12px"><label>New institution name</label><input id="f-newinst" placeholder="e.g. Zoo Zürich" autocomplete="off" value="'+esc(sel.ng.institution)+'"></div>');
          wherePanel.appendChild(nf);
          var ni=nf.querySelector("#f-newinst"); ni.oninput=function(){ sel.ng.institution=ni.value; }; setTimeout(function(){ ni.focus(); },0);
        }
      } else {
        var g=groupById(sel.groupId);
        if(g) wherePanel.appendChild(el('<p class="sub" style="margin:10px 2px 0;font-size:13px">'+esc(g.species)+(g.institution?' · '+esc(g.institution):' · <span style="color:var(--alert)">no institution set</span>')+'</p>'));
      }
    }
    drawWhere();

    app.appendChild(el('<div class="rowlabel">Session details</div>'));
    var form = el('<div class="panel pad"></div>');
    form.innerHTML =
      '<div class="grid2">'+
        '<div class="field" style="margin:0"><label>Observer</label><input id="f-observer" autocomplete="off"></div>'+
        '<div class="field" style="margin:0"><label>Animals present today (N)</label><input id="f-size" type="number" min="0" inputmode="numeric" placeholder="e.g. 14"><div class="hint">Group total on this day — the denominator for proportions.</div></div>'+
      '</div>'+
      '<div class="grid2" style="margin-top:14px">'+
        '<div class="field" style="margin:0"><label>Scan interval</label>'+
          '<select id="f-interval">'+
            [15,30,60,120,180,300,600,900].map(function(v){
              return '<option value="'+v+'"'+(v===state.interval?' selected':'')+'>'+(v<60? v+' sec' : (v/60)+' min')+'</option>';
            }).join("")+
          '</select></div>'+
        '<div class="field" style="margin:0"><label>Notes (optional)</label><input id="f-notes" autocomplete="off"></div>'+
      '</div>';
    app.appendChild(form);
    function syncSize(){ var g=groupById(sel.groupId); var szEl=document.getElementById("f-size"); if(szEl) szEl.value=(g && g.groupSize!=null)? g.groupSize : ""; }
    syncSize();

    app.appendChild(el('<div class="rowlabel">Behaviours for this session</div>'));
    var ethPanel = el('<div class="panel pad"></div>');
    var listWrap = el('<div id="eth-list"></div>');
    ethPanel.appendChild(listWrap);
    var redrawEth = renderBehaviourList(listWrap, eth, null);
    var add = el('<button class="btn small ghost" style="margin-top:4px">＋ Add behaviour</button>');
    add.onclick=function(){ eth.push({name:"",structured:false}); redrawEth(); setTimeout(function(){ var ins=listWrap.querySelectorAll("input"); if(ins.length) ins[ins.length-1].focus(); },0); };
    ethPanel.appendChild(add);
    app.appendChild(ethPanel);
    app.appendChild(el('<p class="sub" style="margin-top:8px;font-size:12px">Turn on <b>Polyadic</b> for a behaviour to log each bout as a chain or cluster with its size during scans.</p>'));

    var opts = el('<div class="panel pad" style="margin-top:14px"></div>');
    opts.appendChild(toggleRow("Sound + vibration cue","Beep and buzz when a scan is due", state.sound, function(v){ state.sound=v; persist(); }));
    opts.appendChild(toggleRow("Carry counts between scans","Start each scan from the previous counts instead of zero", state.carry, function(v){ state.carry=v; persist(); }));
    opts.appendChild(toggleRow("Record animals not in view","Add a per-scan count of animals you can't see", state.trackNIV!==false, function(v){ state.trackNIV=v; persist(); }));
    app.appendChild(opts);

    var startBtn = el('<button class="btn primary" style="margin-top:18px">Start observing</button>');
    startBtn.onclick=function(){
      var behaviours = eth.map(function(b){ return {name:(b.name||"").trim(), structured:!!b.structured}; }).filter(function(b){ return b.name.length; });
      if(behaviours.length===0){ toast("Add at least one behaviour"); return; }

      var grp;
      if(sel.groupId==="__new"){
        var gname=(sel.ng.name||"").trim();
        if(!gname){ toast("Enter a group name"); return; }
        var ginst=(sel.ng.institution||"").trim();
        if(ginst && state.institutions.indexOf(ginst)<0) state.institutions.push(ginst);
        grp={ id:uid(), name:gname, species:(sel.ng.species||state.species[0]||""), institution:ginst, groupSize:null };
        state.groups.push(grp);
      } else {
        grp=groupById(sel.groupId);
        if(!grp){ toast("Pick or create a group"); return; }
      }

      var szVal=parseInt(document.getElementById("f-size").value,10);
      if(isNaN(szVal)) szVal=null;
      if(szVal!=null) grp.groupSize=szVal; // remember as this group's default prefill

      var session = {
        id: uid(),
        groupId: grp.id,
        species: grp.species,
        group: grp.name,
        institution: grp.institution||"",
        observer: (document.getElementById("f-observer").value||"").trim(),
        nPresent: szVal,
        interval: parseInt(document.getElementById("f-interval").value,10)||state.interval,
        notes: (document.getElementById("f-notes").value||"").trim(),
        behaviours: behaviours,
        carry: state.carry,
        trackNIV: state.trackNIV!==false,
        startedAt: new Date().toISOString(),
        scans: []
      };
      state.sessions.push(session);
      persist();
      go("observe", session.id);
    };
    app.appendChild(startBtn);

    var cancel = el('<button class="btn ghost" style="margin-top:10px">Cancel</button>');
    cancel.onclick=function(){ go("home"); };
    app.appendChild(cancel);
  }

  function toggleRow(title, sub, val, onchange){
    var row=el('<div class="toggle"><div class="t-label">'+esc(title)+'<small>'+esc(sub)+'</small></div>'+
      '<label class="switch"><input type="checkbox"'+(val?' checked':'')+'><span></span></label></div>');
    row.querySelector("input").onchange=function(e){ onchange(e.target.checked); };
    return row;
  }

  // Shared editor for a list of behaviour objects {name, structured}. Mutates `list` in place.
  function renderBehaviourList(container, list, persistFn){
    function draw(){
      container.innerHTML="";
      list.forEach(function(b,i){
        var card=el('<div class="beh-edit'+(b.structured?' is-struct':'')+'"></div>');
        var top=el('<div class="top"></div>');
        var inp=el('<input value="'+esc(b.name)+'" placeholder="Behaviour name" autocomplete="off">');
        inp.oninput=function(){ b.name=inp.value; };
        inp.onblur=function(){ b.name=inp.value; if(persistFn) persistFn(); };
        var del=el('<button class="del" aria-label="Remove">×</button>');
        del.onclick=function(){ list.splice(i,1); if(persistFn) persistFn(); draw(); };
        top.appendChild(inp); top.appendChild(del); card.appendChild(top);
        var opt=el('<label class="opt"><span class="switch"><input type="checkbox"'+(b.structured?' checked':'')+'><span></span></span><span class="opt-l">Polyadic — record chain / cluster &amp; size</span></label>');
        opt.querySelector("input").onchange=function(e){ b.structured=e.target.checked; card.classList.toggle("is-struct", b.structured); if(persistFn) persistFn(); };
        card.appendChild(opt);
        container.appendChild(card);
      });
    }
    draw();
    return draw;
  }

  // Simple editor for a list of strings (institutions). Mutates `list` in place.
  function renderStringList(container, list, persistFn, placeholder){
    function draw(){
      container.innerHTML="";
      if(list.length===0) container.appendChild(el('<p class="sub" style="margin:0 0 8px;font-size:12.5px">None yet.</p>'));
      list.forEach(function(v,i){
        var r=el('<div class="editrow"></div>');
        var inp=el('<input value="'+esc(v)+'" placeholder="'+esc(placeholder||"")+'" autocomplete="off">');
        inp.oninput=function(){ list[i]=inp.value; };
        inp.onblur=function(){ list[i]=inp.value.trim(); if(persistFn) persistFn(); };
        var del=el('<button class="del" aria-label="Remove">×</button>');
        del.onclick=function(){ list.splice(i,1); if(persistFn) persistFn(); draw(); };
        r.appendChild(inp); r.appendChild(del); container.appendChild(r);
      });
    }
    draw();
    return draw;
  }

  // Editor for the group registry: name + species + institution per group.
  function renderGroupList(container){
    function draw(){
      container.innerHTML="";
      if(state.groups.length===0){ container.appendChild(el('<p class="sub" style="margin:0;font-size:12.5px">No groups yet. Create one when you start a session.</p>')); return; }
      state.groups.forEach(function(g,i){
        var card=el('<div class="beh-edit"></div>');
        var top=el('<div class="top"></div>');
        var inp=el('<input value="'+esc(g.name)+'" placeholder="Group name" autocomplete="off">');
        inp.oninput=function(){ g.name=inp.value; };
        inp.onblur=function(){ g.name=inp.value.trim()||g.name; persist(); };
        var del=el('<button class="del" aria-label="Remove">×</button>');
        del.onclick=function(){ confirmModal("Remove this group from the list?","“"+g.name+"” will no longer appear when starting a session. Sessions already recorded for it are kept.","Remove",function(){ state.groups.splice(i,1); persist(); draw(); }, true); };
        top.appendChild(inp); top.appendChild(del); card.appendChild(top);
        var row=el('<div class="grid2" style="margin:8px 2px 4px"></div>');
        var spSel=el('<select></select>');
        state.species.forEach(function(sp){ var o=el('<option value="'+esc(sp)+'">'+esc(sp)+'</option>'); if(sp===g.species)o.selected=true; spSel.appendChild(o); });
        if(g.species && state.species.indexOf(g.species)<0){ var og=el('<option value="'+esc(g.species)+'" selected>'+esc(g.species)+'</option>'); spSel.appendChild(og); }
        spSel.onchange=function(){ g.species=spSel.value; persist(); };
        var instSel=el('<select></select>');
        var none=el('<option value="">— institution —</option>'); if(!g.institution)none.selected=true; instSel.appendChild(none);
        if(g.institution && state.institutions.indexOf(g.institution)<0){ var oi=el('<option value="'+esc(g.institution)+'" selected>'+esc(g.institution)+'</option>'); instSel.appendChild(oi); }
        state.institutions.forEach(function(it){ var o=el('<option value="'+esc(it)+'">'+esc(it)+'</option>'); if(it===g.institution)o.selected=true; instSel.appendChild(o); });
        instSel.onchange=function(){ g.institution=instSel.value; persist(); };
        var f1=el('<div class="field" style="margin:0"></div>'); f1.appendChild(spSel);
        var f2=el('<div class="field" style="margin:0"></div>'); f2.appendChild(instSel);
        row.appendChild(f1); row.appendChild(f2); card.appendChild(row);
        container.appendChild(card);
      });
    }
    draw();
    return draw;
  }

  // ---------- OBSERVE (live scanning) ----------
  function renderObserve(app){
    var session = getSession(view.sessionId);
    if(!session){ go("home"); return; }

    // (re)initialise live runtime if needed
    if(!live || live.session.id!==session.id){
      var startCounts = {}, startGroups = {};
      session.behaviours.forEach(function(b){ startCounts[b.name]=0; if(b.structured) startGroups[b.name]=[]; });
      live = {
        session: session,
        counts: startCounts,
        groups: startGroups,
        notInView: 0,
        dom: {},
        remaining: session.interval,
        awaiting: false,
        paused: false,
        tickHandle: null,
        audio: null,
        wakeLock: null
      };
      startTick();
      requestWake();
    }
    live.dom = {}; // dom refs for structured behaviours, rebuilt each render

    var head = el('<div class="obs-head"><div class="who">'+
        '<div class="t">'+esc(session.group)+'</div>'+
        '<div class="s">'+esc(session.species)+(session.institution?' · '+esc(session.institution):'')+'</div>'+
      '</div></div>');
    var endBtn = el('<button class="iconbtn" title="End session" aria-label="End session">✕</button>');
    endBtn.onclick=endSession;
    head.appendChild(endBtn);
    app.appendChild(head);

    app.appendChild(el('<div class="scannum">Recording scan <b class="num">#'+(session.scans.length+1)+'</b>'+
      (session.scans.length? ' · last at '+esc(fmtDateTime(session.scans[session.scans.length-1].timestamp)) : '')+'</div>'));

    // timer
    var timer = el('<div class="timer" id="timerbox">'+
      '<div class="clock num" id="clock">'+fmtClock(live.remaining)+'</div>'+
      '<div class="cap" id="timercap">next scan</div></div>');
    app.appendChild(timer);

    var ctl = el('<div class="timer-ctl"></div>');
    var pauseBtn = el('<button class="btn ghost small" id="pausebtn" style="flex:1">'+(live.paused?'Resume':'Pause')+'</button>');
    pauseBtn.onclick=function(){ live.paused=!live.paused; pauseBtn.textContent=live.paused?'Resume':'Pause'; updateTimerUI(); };
    var nowBtn = el('<button class="btn ghost small" style="flex:1">Scan now</button>');
    nowBtn.onclick=function(){ live.remaining=0; live.awaiting=true; cue(); updateTimerUI(); };
    var resetBtn = el('<button class="btn ghost small" style="flex:1">Reset timer</button>');
    resetBtn.onclick=function(){ live.remaining=session.interval; live.awaiting=false; updateTimerUI(); };
    ctl.appendChild(pauseBtn); ctl.appendChild(nowBtn); ctl.appendChild(resetBtn);
    app.appendChild(ctl);

    // behaviours
    app.appendChild(el('<div class="rowlabel">Count per behaviour</div>'));
    var behPanel = el('<div class="panel pad"></div>');
    session.behaviours.forEach(function(b){
      if(b.structured){ renderStructBehaviour(b, behPanel); return; }
      var row = el('<div class="beh"><div class="name">'+esc(b.name)+'</div></div>');
      var st = el('<div class="stepper"></div>');
      var minus = el('<button aria-label="Decrease '+esc(b.name)+'">−</button>');
      var val = el('<div class="val num'+(live.counts[b.name]?'':' zero')+'" data-b="'+esc(b.name)+'">'+live.counts[b.name]+'</div>');
      var plus = el('<button aria-label="Increase '+esc(b.name)+'">＋</button>');
      minus.onclick=function(){ setCount(b.name, live.counts[b.name]-1, val); };
      plus.onclick=function(){ setCount(b.name, live.counts[b.name]+1, val); };
      st.appendChild(minus); st.appendChild(val); st.appendChild(plus);
      row.appendChild(st); behPanel.appendChild(row);
    });
    app.appendChild(behPanel);
    session.behaviours.forEach(function(b){ if(b.structured) drawChips(b.name); });

    if(session.trackNIV){
      app.appendChild(el('<div class="rowlabel">Not in view</div>'));
      var nivPanel=el('<div class="panel pad"></div>');
      var nrow=el('<div class="beh"><div class="name">Animals not in view</div></div>');
      var nst=el('<div class="stepper"></div>');
      var nminus=el('<button aria-label="Decrease not in view">−</button>');
      var nval=el('<div class="val num'+(live.notInView?'':' zero')+'" id="niv-val">'+live.notInView+'</div>');
      var nplus=el('<button aria-label="Increase not in view">＋</button>');
      nminus.onclick=function(){ setNIV(live.notInView-1); };
      nplus.onclick=function(){ setNIV(live.notInView+1); };
      nst.appendChild(nminus); nst.appendChild(nval); nst.appendChild(nplus);
      nrow.appendChild(nst); nivPanel.appendChild(nrow);
      app.appendChild(nivPanel);
    }

    var present = presentN(session);
    var tally = el('<div class="tally">'+
      '<span>Scored <b class="num" id="tally-n">'+total()+'</b>'+
        (session.trackNIV? ' · <span class="num" id="tally-niv">'+live.notInView+'</span> not in view':'')+'</span>'+
      (present!=null? '<span id="tally-of">of N = '+present+'</span>':'')+'</div>');
    app.appendChild(tally);

    var saveWrap = el('<div class="sticky-save"></div>');
    var save = el('<button class="btn primary" id="savebtn">Save scan</button>');
    save.onclick=saveScan;
    saveWrap.appendChild(save);
    app.appendChild(saveWrap);

    updateTimerUI();
  }

  function setCount(b, v, valEl){
    if(v<0) v=0;
    live.counts[b]=v;
    valEl.textContent=v;
    valEl.classList.toggle("zero", v===0);
    updateTally();
  }
  function total(){ var t=0; for(var k in live.counts) t+=live.counts[k]; return t; }
  function presentN(s){ return s.nPresent!=null ? s.nPresent : (s.groupSize!=null ? s.groupSize : null); }
  function setNIV(v){
    if(v<0) v=0;
    live.notInView=v;
    var e=document.getElementById("niv-val");
    if(e){ e.textContent=v; e.classList.toggle("zero", v===0); }
    updateTally();
  }
  function updateTally(){
    var tn=document.getElementById("tally-n"); if(!tn) return;
    var t=total(); tn.textContent=t;
    var nivEl=document.getElementById("tally-niv"); if(nivEl) nivEl.textContent=live.notInView;
    var present=presentN(live.session);
    var ofs=document.getElementById("tally-of");
    if(ofs){
      var accounted = t + (live.session.trackNIV? live.notInView : 0);
      ofs.classList.toggle("over", present!=null && accounted>present);
    }
  }
  function recomputeStruct(name){ var arr=live.groups[name]||[]; var s=0; for(var i=0;i<arr.length;i++) s+=arr[i].size; live.counts[name]=s; }

  function renderStructBehaviour(b, panel){
    var name=b.name;
    var block=el('<div class="beh-struct"></div>');
    var head=el('<div class="beh-head"><span class="name">'+esc(name)+'</span><span class="sumcount"></span></div>');
    block.appendChild(head);
    var chips=el('<div class="chips"></div>');
    block.appendChild(chips);
    var addr=el('<div class="addrow"></div>');
    var ac=el('<button>＋ Chain <span class="k">A→B→C</span></button>');
    var au=el('<button>＋ Cluster <span class="k">around one</span></button>');
    ac.onclick=function(){ addSub(name,"chain"); };
    au.onclick=function(){ addSub(name,"cluster"); };
    addr.appendChild(ac); addr.appendChild(au);
    block.appendChild(addr);
    panel.appendChild(block);
    live.dom[name]={ chips:chips, sum:head.querySelector(".sumcount") };
  }
  function addSub(name, type){
    if(!live.groups[name]) live.groups[name]=[];
    live.groups[name].push({type:type, size:3}); // polyadic = 3+ individuals
    recomputeStruct(name); drawChips(name);
    if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){}
  }
  function drawChips(name){
    var ref=live.dom[name]; if(!ref) return;
    var arr=live.groups[name]||[];
    ref.chips.innerHTML="";
    if(arr.length===0){ ref.chips.appendChild(el('<span class="chip empty-note">No polyadic bouts this scan</span>')); }
    arr.forEach(function(g,idx){
      var chip=el('<span class="chip"></span>');
      chip.appendChild(el('<span class="ct '+g.type+'">'+(g.type==="chain"?"Chain":"Cluster")+'</span>'));
      var ms=el('<span class="msize"></span>');
      var minus=el('<button aria-label="Smaller">−</button>');
      var sv=el('<span class="sv num">'+g.size+'</span>');
      var plus=el('<button aria-label="Larger">＋</button>');
      minus.onclick=function(){ if(g.size>3){ g.size--; sv.textContent=g.size; recomputeStruct(name); updateSum(name); } };
      plus.onclick=function(){ g.size++; sv.textContent=g.size; recomputeStruct(name); updateSum(name); };
      ms.appendChild(minus); ms.appendChild(sv); ms.appendChild(plus);
      chip.appendChild(ms);
      var rm=el('<button class="rm" aria-label="Remove bout">×</button>');
      rm.onclick=function(){ arr.splice(idx,1); recomputeStruct(name); drawChips(name); };
      chip.appendChild(rm);
      ref.chips.appendChild(chip);
    });
    updateSum(name);
  }
  function updateSum(name){
    var ref=live.dom[name]; if(!ref) return;
    var arr=live.groups[name]||[]; var s=live.counts[name]||0;
    ref.sum.innerHTML = arr.length ? ('<b>'+s+'</b> in '+arr.length+' bout'+(arr.length===1?'':'s')) : '0';
    updateTally();
  }

  function saveScan(){
    var s=live.session;
    var groupsSnap={};
    s.behaviours.forEach(function(b){ if(b.structured) groupsSnap[b.name]=clone(live.groups[b.name]||[]); });
    var scan = { n: s.scans.length+1, timestamp: new Date().toISOString(), counts: clone(live.counts), groups: groupsSnap };
    if(s.trackNIV) scan.notInView = live.notInView;
    s.scans.push(scan);
    persist();
    // reset for next scan
    if(!s.carry){ s.behaviours.forEach(function(b){ live.counts[b.name]=0; if(b.structured) live.groups[b.name]=[]; }); live.notInView=0; }
    live.remaining = s.interval;
    live.awaiting = false;
    toast("Scan #"+scan.n+" saved");
    if(navigator.vibrate) try{ navigator.vibrate(20); }catch(e){}
    render(); // redraw scan number + steppers
  }

  function startTick(){
    stopTick();
    live.tickHandle = setInterval(function(){
      if(live.paused) return;
      if(live.remaining>0){
        live.remaining--;
        if(live.remaining===0 && !live.awaiting){ live.awaiting=true; cue(); }
        updateTimerUI();
      }
    }, 1000);
  }
  function stopTick(){ if(live && live.tickHandle){ clearInterval(live.tickHandle); live.tickHandle=null; } }

  function updateTimerUI(){
    var box=document.getElementById("timerbox"); if(!box) return;
    var clock=document.getElementById("clock");
    var cap=document.getElementById("timercap");
    clock.textContent = live.awaiting ? "SCAN NOW" : fmtClock(live.remaining);
    if(live.awaiting){ clock.style.fontSize="34px"; } else { clock.style.fontSize=""; }
    cap.textContent = live.paused ? "paused" : (live.awaiting ? "record what you see now" : "next scan");
    box.classList.toggle("due", live.awaiting && !live.paused);
    box.classList.toggle("paused", live.paused);
  }

  function cue(){
    if(!live.session) return;
    if(state.sound) beep();
    if(navigator.vibrate) try{ navigator.vibrate([120,60,120]); }catch(e){}
  }
  function beep(){
    try{
      if(!live.audio) live.audio = new (window.AudioContext||window.webkitAudioContext)();
      var ctx=live.audio;
      if(ctx.state==="suspended") ctx.resume();
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      var t=ctx.currentTime;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      o.start(t); o.stop(t+0.42);
    }catch(e){}
  }

  function requestWake(){
    if(!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function(wl){
      live.wakeLock=wl;
      wl.addEventListener("release", function(){});
    }).catch(function(){});
  }
  function releaseWake(){
    if(live && live.wakeLock){ try{ live.wakeLock.release(); }catch(e){} live.wakeLock=null; }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && live && view.name==="observe" && !live.wakeLock) requestWake();
  });

  function stopLive(clear){
    stopTick(); releaseWake();
    if(clear) live=null;
  }

  function endSession(){
    var s=live?live.session:getSession(view.sessionId);
    confirmModal("End session?", (s? s.scans.length : 0)+" scan"+((s&&s.scans.length===1)?"":"s")+" saved. You can reopen it any time to view, export, or add more scans.", "End session", function(){
      stopLive(true);
      go("data", s.id);
    });
  }

  // ---------- DATA (per session) ----------
  function renderData(app){
    var s=getSession(view.sessionId);
    if(!s){ go("home"); return; }

    var back=el('<button class="btn ghost small" style="width:auto;margin-top:6px">‹ All sessions</button>');
    back.onclick=function(){ go("home"); };
    app.appendChild(back);

    app.appendChild(el('<h1 class="page">'+esc(s.group)+'</h1>'));
    var metabits=[esc(s.species)];
    if(s.institution) metabits.push(esc(s.institution));
    metabits.push(fmtDate(s.startedAt));
    if(s.observer) metabits.push(esc(s.observer));
    app.appendChild(el('<p class="sub">'+metabits.join(" · ")+'</p>'));

    var editBtn=el('<button class="btn ghost small" style="width:auto;margin:-6px 0 4px">Edit group &amp; institution</button>');
    editBtn.onclick=function(){ editSessionModal(s); };
    app.appendChild(editBtn);

    // summary panel
    var totalInd=0; s.scans.forEach(function(sc){ for(var k in sc.counts) totalInd+=sc.counts[k]; });
    var present=presentN(s);
    var nivScans=s.scans.filter(function(sc){ return sc.notInView!=null; });
    var meanNIV = nivScans.length ? (nivScans.reduce(function(a,sc){return a+sc.notInView;},0)/nivScans.length) : null;
    var sumPanel=el('<div class="panel pad" style="display:flex;gap:22px;flex-wrap:wrap"></div>');
    sumPanel.innerHTML=
      statBlock(s.scans.length,"scans")+
      statBlock(present!=null?present:"—","N present")+
      statBlock((s.interval<60? s.interval+"s" : (s.interval/60)+"m"),"interval")+
      statBlock(s.behaviours.length,"behaviours")+
      (meanNIV!=null? statBlock(meanNIV.toFixed(1),"mean not in view") : "")+
      statBlock(totalInd,"records");
    app.appendChild(sumPanel);

    // actions
    var actions=el('<div class="btnrow" style="margin-top:14px"></div>');
    var cont=el('<button class="btn primary small" style="flex:1">Continue scanning</button>');
    cont.onclick=function(){ go("observe", s.id); };
    var exp=el('<button class="btn small" style="flex:1">Export CSV</button>');
    exp.onclick=function(){ openExport([s], safeName(s.group)); };
    actions.appendChild(cont); actions.appendChild(exp);
    app.appendChild(actions);

    // grooming quick-look: mean count per grooming behaviour (nice for the stated purpose)
    var groomKeys = s.behaviours.filter(function(b){ return /groom/i.test(b.name); });
    if(groomKeys.length && s.scans.length){
      app.appendChild(el('<div class="rowlabel">Grooming — mean individuals per scan</div>'));
      var gp=el('<div class="panel pad"></div>');
      groomKeys.forEach(function(b){
        var sum=0; s.scans.forEach(function(sc){ sum+=(sc.counts[b.name]||0); });
        var mean=(sum/s.scans.length);
        gp.appendChild(el('<div class="beh"><div class="name">'+esc(b.name)+'</div>'+
          '<div class="num" style="font-family:var(--disp);font-weight:600;font-size:18px">'+mean.toFixed(2)+'</div></div>'));
      });
      app.appendChild(gp);
    }

    // polyadic structure summary
    s.behaviours.filter(function(b){ return b.structured; }).forEach(function(b){
      var name=b.name, bouts=[];
      s.scans.forEach(function(sc){
        var arr = sc.groups && sc.groups[name] ? sc.groups[name] : [];
        arr.forEach(function(g){ bouts.push(g); });
      });
      if(!bouts.length) return;
      var chains=bouts.filter(function(x){return x.type==="chain";}).length;
      var clusters=bouts.filter(function(x){return x.type==="cluster";}).length;
      var meanSize=bouts.reduce(function(a,x){return a+x.size;},0)/bouts.length;
      var maxSize=bouts.reduce(function(a,x){return Math.max(a,x.size);},0);
      app.appendChild(el('<div class="rowlabel">'+esc(name)+' — structure</div>'));
      var sp=el('<div class="panel pad" style="display:flex;gap:22px;flex-wrap:wrap"></div>');
      sp.innerHTML = statBlock(bouts.length,"bouts")+statBlock(clusters,"clusters")+statBlock(chains,"chains")+statBlock(meanSize.toFixed(1),"mean size")+statBlock(maxSize,"max size");
      app.appendChild(sp);
    });

    // scans table
    app.appendChild(el('<div class="rowlabel">Scans</div>'));
    if(s.scans.length===0){
      app.appendChild(el('<div class="panel"><div class="empty" style="padding:30px">No scans recorded yet.</div></div>'));
    } else {
      var tp=el('<div class="panel"><div class="tablescroll"></div></div>');
      var tbl=el('<table></table>');
      var showNIV = s.scans.some(function(sc){ return sc.notInView!=null; });
      var head='<tr><th>#</th><th>Time</th>'+s.behaviours.map(function(b){return '<th>'+esc(b.name)+'</th>';}).join("")+'<th>Total</th>'+(showNIV?'<th>Not in view</th>':'')+'</tr>';
      var thead=el('<thead>'+head+'</thead>'); tbl.appendChild(thead);
      var tb=el('<tbody></tbody>');
      s.scans.forEach(function(sc){
        var tot=0; s.behaviours.forEach(function(b){ tot+=(sc.counts[b.name]||0); });
        var tt=new Date(sc.timestamp);
        var tstr=tt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"});
        var cells=s.behaviours.map(function(b){ return '<td class="n">'+(sc.counts[b.name]||0)+'</td>'; }).join("");
        var nivCell = showNIV ? '<td class="n">'+(sc.notInView==null?'':sc.notInView)+'</td>' : '';
        tb.appendChild(el('<tr><td class="n num">'+sc.n+'</td><td>'+esc(tstr)+'</td>'+cells+'<td class="n num"><b>'+tot+'</b></td>'+nivCell+'</tr>'));
      });
      tbl.appendChild(tb);
      tp.querySelector(".tablescroll").appendChild(tbl);
      app.appendChild(tp);
    }

    // danger
    var del=el('<button class="btn danger ghost" style="margin-top:18px">Delete session</button>');
    del.onclick=function(){
      confirmModal("Delete this session?","This permanently removes "+s.scans.length+" scan"+(s.scans.length===1?"":"s")+". Export first if you need the data.","Delete", function(){
        state.sessions=state.sessions.filter(function(x){return x.id!==s.id;});
        persist(); go("home"); toast("Session deleted");
      }, true);
    };
    app.appendChild(del);
  }

  function safeName(s){ return String(s||"session").replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40)||"session"; }

  // ================= CSV / EXPORT =================
  function csvCell(v){
    if(v==null) v="";
    v=String(v);
    if(/[",\n\r]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function buildLong(sessions){
    var head=["session_id","date","species","group","institution","observer","n_present","scan_interval_s","scan_number","scan_timestamp","not_in_view","behaviour","count","structure","subgroup_size"];
    var rows=[head.join(",")];
    sessions.forEach(function(s){
      var np = s.nPresent!=null ? s.nPresent : (s.groupSize==null?"":s.groupSize);
      var base=[s.id, isoDate(s.startedAt), s.species, s.group, s.institution||s.location||"", s.observer||"", np, s.interval];
      s.scans.forEach(function(sc){
        var niv = sc.notInView==null ? "" : sc.notInView;
        s.behaviours.forEach(function(b){
          var name=b.name;
          if(b.structured){
            var arr = sc.groups && sc.groups[name] ? sc.groups[name] : [];
            if(arr.length){
              arr.forEach(function(g){
                rows.push(base.concat([sc.n, sc.timestamp, niv, name, g.size, g.type, g.size]).map(csvCell).join(","));
              });
            } else {
              rows.push(base.concat([sc.n, sc.timestamp, niv, name, 0, "", ""]).map(csvCell).join(","));
            }
          } else {
            rows.push(base.concat([sc.n, sc.timestamp, niv, name, (sc.counts[name]||0), "", ""]).map(csvCell).join(","));
          }
        });
      });
    });
    return rows.join("\r\n");
  }
  function buildWide(sessions){
    // union of behaviours across included sessions
    var behs=[]; sessions.forEach(function(s){ s.behaviours.forEach(function(b){ if(behs.indexOf(b.name)<0) behs.push(b.name); }); });
    var head=["session_id","date","species","group","institution","observer","n_present","scan_interval_s","scan_number","scan_timestamp","not_in_view"].concat(behs).concat(["total"]);
    var rows=[head.map(csvCell).join(",")];
    sessions.forEach(function(s){
      var np = s.nPresent!=null ? s.nPresent : (s.groupSize==null?"":s.groupSize);
      var base=[s.id, isoDate(s.startedAt), s.species, s.group, s.institution||s.location||"", s.observer||"", np, s.interval];
      s.scans.forEach(function(sc){
        var niv = sc.notInView==null ? "" : sc.notInView;
        var tot=0; for(var k in sc.counts) tot+=sc.counts[k];
        var cells=behs.map(function(b){ return (b in sc.counts)? sc.counts[b] : ""; });
        rows.push(base.concat([sc.n, sc.timestamp, niv]).concat(cells).concat([tot]).map(csvCell).join(","));
      });
    });
    return rows.join("\r\n");
  }
  function isoDate(iso){ try{ return new Date(iso).toISOString().slice(0,10); }catch(e){ return ""; } }

  function openExport(sessions, nameBase){
    var nScans=0; sessions.forEach(function(s){ nScans+=s.scans.length; });
    if(nScans===0){ toast("Nothing to export yet"); return; }
    var fmt="long";
    var bg=el('<div class="modal-bg"></div>');
    var m=el('<div class="modal"><div class="m-pad">'+
      '<h3>Export CSV</h3>'+
      '<p class="m-sub">'+sessions.length+' session'+(sessions.length===1?"":"s")+' · '+nScans+' scan'+(nScans===1?"":"s")+'. Long format has one row per behaviour per scan (best for analysis). Wide has one row per scan.</p>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span style="font-size:13px;color:var(--ink-2)">Format</span>'+
        '<div class="seg" id="fmtseg"><button data-f="long" class="on">Long (tidy)</button><button data-f="wide">Wide</button></div></div>'+
      '<textarea class="csv" id="csvout" readonly></textarea>'+
      '</div></div>');
    var pad=m.querySelector(".m-pad");
    var actions=el('<div class="btnrow" style="margin-top:14px"></div>');
    var dl=el('<button class="btn primary small" style="flex:1">Download .csv</button>');
    var cp=el('<button class="btn small" style="flex:1">Copy</button>');
    var cl=el('<button class="btn ghost small" style="flex:1">Close</button>');
    actions.appendChild(dl); actions.appendChild(cp); actions.appendChild(cl);
    pad.appendChild(actions);

    function refresh(){
      var text = fmt==="long"? buildLong(sessions) : buildWide(sessions);
      m.querySelector("#csvout").value=text;
      return text;
    }
    m.querySelector("#fmtseg").addEventListener("click", function(e){
      var b=e.target.closest("button"); if(!b) return;
      fmt=b.getAttribute("data-f");
      Array.prototype.forEach.call(m.querySelectorAll("#fmtseg button"), function(x){ x.classList.toggle("on", x===b); });
      refresh();
    });
    refresh();

    dl.onclick=function(){ doDownload(nameBase+"-"+fmt+".csv", m.querySelector("#csvout").value); };
    cp.onclick=function(){
      var ta=m.querySelector("#csvout"); ta.select();
      var ok=false;
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(function(){ toast("Copied to clipboard"); }).catch(function(){ try{document.execCommand("copy"); toast("Copied");}catch(e){} }); }
      else { try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select all and copy manually"); } }
    };
    cl.onclick=close; bg.onclick=function(e){ if(e.target===bg) close(); };
    function close(){ if(bg.parentNode) bg.parentNode.removeChild(bg); }
    bg.appendChild(m); document.body.appendChild(bg);
  }

  function doDownload(filename, text){
    // Preferred: platform downloads capability (published Artifact). Fallback: the copy box already visible.
    if(window.claude && typeof window.claude.use==="function"){
      window.claude.use("downloads").then(function(dl){
        if(!dl){ browserDownload(filename, text); return; }
        dl.save({ filename: filename, data: text }).then(function(r){
          toast("Saved "+filename);
        }).catch(function(err){
          var code=err&&err.code;
          if(code==="declined"){ /* user cancelled — do nothing */ }
          else if(code==="rate_limited"){ toast("Try the download again in a moment"); }
          else { browserDownload(filename, text); }
        });
      }).catch(function(){ browserDownload(filename, text); });
    } else {
      browserDownload(filename, text);
    }
  }
  function browserDownload(filename, text){
    try{
      var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 100);
      toast("Downloaded "+filename);
    }catch(e){ toast("Use the Copy button to get your data"); }
  }

  // ---------- confirm modal ----------
  function confirmModal(title, body, okLabel, onOk, danger){
    var bg=el('<div class="modal-bg"></div>');
    var m=el('<div class="modal"><div class="m-pad"><h3>'+esc(title)+'</h3><p class="m-sub">'+esc(body)+'</p></div></div>');
    var pad=m.querySelector(".m-pad");
    var row=el('<div class="btnrow"></div>');
    var cancel=el('<button class="btn ghost small" style="flex:1">Cancel</button>');
    var ok=el('<button class="btn small '+(danger?'danger':'primary')+'" style="flex:1">'+esc(okLabel)+'</button>');
    if(danger){ ok.classList.remove("primary"); }
    if(!danger){ ok.classList.add("primary"); }
    row.appendChild(cancel); row.appendChild(ok); pad.appendChild(row);
    function close(){ if(bg.parentNode) bg.parentNode.removeChild(bg); }
    cancel.onclick=close; bg.onclick=function(e){ if(e.target===bg) close(); };
    ok.onclick=function(){ close(); onOk(); };
    bg.appendChild(m); document.body.appendChild(bg);
  }

  // ---------- boot ----------
  render();
})();
</script>
</body>
